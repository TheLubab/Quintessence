name: Code checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@v31

      - name: Cache Nix check tools
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-ci-v1-${{ runner.os }}-${{ runner.arch }}-
          # Seed the default-branch cache without creating a large copy per PR.
          save: ${{ github.event_name == 'push' }}

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            bun-ci-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install locked dependencies
        run: nix develop .#checks --command bun install --frozen-lockfile

      - name: Run all checks in the Nix checks shell
        env:
          # Avoid loading Linux keychain libraries into the Sharp test process.
          QUINT_SECRET_BACKEND: file
        run: nix develop .#checks --command bun run checks

  windows-tests:
    name: Tests (Windows)
    # Temporarily disabled; remove this condition to restore Windows CI coverage.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ steps.bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: >-
          bun test
          backend/agents/auth.test.ts
          backend/agents/meta/adapter.test.ts
          backend/agents/meta/config.test.ts
          backend/agents/meta/approvals.test.ts
          shared/meta-models.test.ts

name: Deliver release to Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to mirror or retry
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-release
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-24.04
    environment: cloudflare
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Download published assets and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-metadata.json
          gh release download "$RELEASE_TAG" --dir release-assets
      - name: Verify and publish to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: nix develop --command bun scripts/publish-cloudflare.ts

name: Deploy Quint website

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: cloudflare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Deploy static assets and release routes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: nix develop --command bunx wrangler@4.157.0 deploy --config cloudflare/wrangler.jsonc

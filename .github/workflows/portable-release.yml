name: Portable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.1.1)
        required: true

permissions:
  contents: read

concurrency:
  group: portable-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Package all targets with Nix on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Check tag and configure public build input
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PUBLIC_TLDRAW_LICENSE_KEY: ${{ vars.PUBLIC_TLDRAW_LICENSE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag does not match package.json')
          Path('packaging/tldraw-public-key.txt').write_text(os.environ['PUBLIC_TLDRAW_LICENSE_KEY'])
          PY
      - name: Build portable archives
        # path: includes the generated public key without changing the checkout.
        run: nix build path:.#release-all --out-link portable-result --print-build-logs --max-jobs 2
      - uses: actions/upload-artifact@v7
        with:
          name: quint-linux-x64
          path: portable-result/quint-linux-x64.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: quint-linux-arm64
          path: portable-result/quint-linux-arm64.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: quint-macos-x64
          path: portable-result/quint-macos-x64.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: quint-macos-arm64
          path: portable-result/quint-macos-arm64.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: quint-windows-x64
          path: portable-result/quint-windows-x64.zip
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: quint-windows-arm64
          path: portable-result/quint-windows-arm64.zip
          compression-level: 0
          if-no-files-found: error

  unix-smoke:
    name: ${{ matrix.target }} archive startup
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: macos-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: quint-${{ matrix.target }}
      - name: Start bundled runtime, CLI, and native image dependency
        env:
          QUINT_SECRET_BACKEND: file
        run: |
          mkdir app
          tar -xzf "quint-${{ matrix.target }}.tar.gz" -C app
          ./app/runtime/bun --version
          ./app/runtime/bun ./app/app/backend/cli.ts version
          cd app/app
          ../runtime/bun -e "const sharp = (await import('sharp')).default; await sharp({ create: { width: 1, height: 1, channels: 4, background: '#fff' } }).png().toBuffer()"

  windows-smoke:
    name: Windows ${{ matrix.arch }} archive startup
    needs: build
    strategy:
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: quint-windows-${{ matrix.arch }}
      - name: Start bundled runtime and CLI
        shell: pwsh
        run: |
          Expand-Archive "quint-windows-${{ matrix.arch }}.zip" app
          & ./app/runtime/bun.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Bun failed' }
          & ./app/runtime/bun.exe ./app/app/backend/cli.ts version
          if ($LASTEXITCODE -ne 0) { throw 'Quint CLI failed' }
          & ./app/runtime/bun.exe -e "await import('sharp')" --cwd ./app/app
          if ($LASTEXITCODE -ne 0) { throw 'Native image dependency failed' }
      - name: Check packaged scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem ./app/app/packaging -Filter '*.ps1') {
            $parseTokens = $null
            $parseErrors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              throw (($parseErrors | ForEach-Object { "$($file.Name):$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`n")
            }
            if ($file.Name -eq 'install.ps1') {
              $architecture = $ast.Find({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Get-QuintArchitecture' }, $true)
              if (-not $architecture) { throw 'Installer architecture function was not found' }
              . ([scriptblock]::Create($architecture.Extent.Text))
              if ((Get-QuintArchitecture) -notin @('x64', 'arm64')) { throw 'Installer architecture detection failed' }
              $utf8 = [System.Text.UTF8Encoding]::new($false)
              if ($utf8.GetPreamble().Length -ne 0) { throw 'Launcher encoding must not include a BOM' }
            }
            Write-Host "Checked $($file.Name)"
          }

  draft:
    name: Prepare GitHub Release and quint.run installers
    needs: [build, unix-smoke, windows-smoke]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: quint-*
          merge-multiple: true
          path: release-assets
      - name: Create checksums and public installer scripts
        env:
          RELEASE_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          assets = Path('release-assets')
          archives = sorted(p for p in assets.iterdir() if p.suffix in ('.gz', '.zip'))
          if len(archives) != 6:
              raise SystemExit('Expected all six platform archives')
          (assets / 'checksums.txt').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in archives))
          for name in ('install.sh', 'install.ps1'):
              text = Path('packaging', name).read_text().replace('@QUINT_RELEASE_REPO@', os.environ['RELEASE_REPO'])
              (assets / name).write_text(text)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: quint-run-installers
          path: |
            release-assets/install.sh
            release-assets/install.ps1
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          case "$RELEASE_TAG" in *-*) gh release edit "$RELEASE_TAG" --prerelease ;; esac

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #020204; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script>
const frag = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vTextureCoord;
uniform float uTime;
uniform vec2  uRes;
uniform vec2  uMouse;
uniform float uKick;
uniform float uPulse;
uniform sampler2D uNoise;

#define TAU 6.28318530718
#define PI  3.14159265359

float noise(vec2 p){ return texture2D(uNoise, p / 16.0).r; }
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++){ v += a * noise(p); p = p * 2.03 + 11.7; a *= 0.5; }
  return v;
}

mat2 rot2(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
mat3 rotX(float a){ float c = cos(a), s = sin(a); return mat3(1.0,0.0,0.0, 0.0,c,s, 0.0,-s,c); }
mat3 rotY(float a){ float c = cos(a), s = sin(a); return mat3(c,0.0,-s, 0.0,1.0,0.0, s,0.0,c); }
mat3 rotZ(float a){ float c = cos(a), s = sin(a); return mat3(c,s,0.0, -s,c,0.0, 0.0,0.0,1.0); }

// sci-fi palette: cyan -> violet -> magenta -> mint -> cyan
vec3 sci(float t){
  float x = fract(t) * 4.0;
  vec3 a = vec3(0.05, 0.85, 1.00);
  vec3 b = vec3(0.40, 0.22, 1.00);
  vec3 c = vec3(1.00, 0.12, 0.62);
  vec3 d = vec3(0.10, 1.00, 0.70);
  vec3 col = mix(a, b, smoothstep(0.0, 1.0, x));
  col = mix(col, c, smoothstep(1.0, 2.0, x));
  col = mix(col, d, smoothstep(2.0, 3.0, x));
  col = mix(col, a, smoothstep(3.0, 4.0, x));
  return col;
}

// thin grid line on integer values of v
float gline(float v){ return smoothstep(0.46, 0.5, abs(fract(v) - 0.5)); }

// ---------------- the orb ----------------
vec3 orb(vec2 p, float R){
  float k = length(p) / R;
  if (k > 1.01) return vec3(0.0);
  float mask = 1.0 - smoothstep(0.994, 1.006, k);
  vec2 q = p / R;
  q *= min(1.0, 0.999 / max(k, 0.0001));
  float z = sqrt(max(0.0, 1.0 - dot(q, q)));
  vec3 n = vec3(q, z);
  float ndv = z;
  float f = 1.0 - ndv;
  float t = uTime;

  // ---- energy core: swirling ridged plasma, hot center
  vec2 u = rot2(t * 0.25 + 2.2 * (1.0 - k * k)) * (q * 1.5);
  vec2 wv = vec2(fbm(u * 1.1 + vec2(t * 0.15, 0.0)),
                 fbm(u * 1.1 + vec2(4.7, -t * 0.12))) - 0.44;
  float f1 = fbm(u * 1.3 + wv * 2.0 + vec2(0.0, t * 0.1)) / 0.875;
  float rid = pow(max(1.0 - abs(2.0 * f1 - 1.0), 0.0), 5.0);
  float core = exp(-k * k * 10.0);
  float halo = exp(-k * k * 3.0);
  float pulse = 0.88 + 0.12 * sin(t * 2.2) + uKick * 0.9;
  vec3 plasma = sci(f1 * 0.9 + k * 0.5 + t * 0.04) * rid * halo * 1.7;
  vec3 coreC = (vec3(0.55, 0.95, 1.0) * core * 1.2 + vec3(0.25, 0.35, 1.0) * halo * 0.28) * pulse;
  vec3 col = plasma * pulse + coreC;

  // ---- holographic globe grid (front surface + faint back surface)
  mat3 Mg = rotY(t * 0.14 + uMouse.x * 0.7) * rotX(0.4 + uMouse.y * 0.5);
  vec3 sf = Mg * n;
  vec3 sb = Mg * vec3(n.xy, -n.z);
  float lonF = atan(sf.x, sf.z) / TAU * 24.0;
  float latF = asin(clamp(sf.y, -1.0, 1.0)) / PI * 12.0;
  float lonB = atan(sb.x, sb.z) / TAU * 24.0;
  float latB = asin(clamp(sb.y, -1.0, 1.0)) / PI * 12.0;
  float lnF = gline(lonF);
  float ltF = gline(latF);
  float gF = max(lnF, ltF * 0.85);
  float gB = max(gline(lonB), gline(latB) * 0.85);
  float nodes = lnF * ltF;

  // scan plane sweeping up and down
  float sweep = sin(t * 0.55) * 0.95;
  float bd = (n.y - sweep) * 6.0;
  float band = exp(-bd * bd);

  vec3 gcol = sci(sf.y * 0.35 + t * 0.05 + 0.1);
  float gAmt = 0.10 + 0.75 * f * f + band * 1.6;
  col += gcol * (gF * gAmt + nodes * (0.35 + band * 2.0) + gB * 0.07 + band * 0.06);

  // ---- glass shell: fresnel rim with chromatic fringe
  vec3 irid = sci(ndv * 1.1 + n.y * 0.25 + t * 0.06);
  vec3 rimRGB = vec3(pow(f, 2.0) * 0.85, pow(f, 3.0) * 1.0, pow(f, 4.5) * 1.4);
  col += rimRGB * (0.35 + 1.1 * irid) * 1.2;
  col += irid * smoothstep(0.955, 0.995, k) * 0.7;

  // ---- glossy crescents + specular
  float ang = atan(q.y, q.x);
  float arcBand = smoothstep(0.80, 0.85, k) * (1.0 - smoothstep(0.87, 0.92, k));
  float a1 = pow(max(cos(ang - 2.35), 0.0), 5.0);
  float a2 = pow(max(cos(ang + 0.75), 0.0), 7.0);
  float spec = pow(max(dot(n, normalize(vec3(-0.5, 0.62, 0.6))), 0.0), 120.0);
  col += vec3(0.85, 0.97, 1.0) * (arcBand * (a1 * 0.9 + a2 * 0.45) + spec * 0.9);

  return col * mask;
}

// ---------------- orbiting ring (analytic, 3D-tilted) ----------------
vec3 ring(vec2 p, mat3 M, float Rr, float w, float speed, float ticks, float dashes, vec3 tint, float R){
  vec3 N = M[1];
  float z = -(N.x * p.x + N.y * p.y) / N.z;
  vec3 l = vec3(p, z) * M;
  float rho = length(l.xz);
  float th = atan(l.z, l.x);
  float px = 1.6 / min(uRes.x, uRes.y);
  float d = abs(rho - Rr);

  float head = pow(0.5 + 0.5 * cos(th - uTime * speed), 12.0);
  float line = 1.0 - smoothstep(w, w + px, d);
  if (dashes > 0.5) line *= step(fract(th / TAU * dashes + uTime * speed * 0.03), 0.62);
  float body = line * (0.30 + 2.2 * head);

  float tk = 0.0;
  if (ticks > 0.5) {
    float fr = abs(fract(th / TAU * ticks) - 0.5);
    tk = smoothstep(0.40, 0.5, fr)
       * (1.0 - smoothstep(0.004, 0.004 + px, abs(rho - Rr - 0.007)))
       * (0.25 + 0.8 * head);
  }
  float glow = exp(-d * 60.0) * (0.05 + 0.25 * head);

  float depth = 0.45 + 0.55 * smoothstep(-Rr, Rr, z);
  float behind = 1.0 - smoothstep(-0.01, 0.01, z);
  float vis = 1.0 - 0.85 * behind * (1.0 - smoothstep(R * 0.99, R * 1.01, length(p)));

  vec3 c = mix(tint, vec3(1.0), head * 0.6);
  return c * (body + tk + glow) * depth * vis;
}

void main(){
  vec2 p = (vTextureCoord - 0.5) * uRes / min(uRes.x, uRes.y);
  p.y = -p.y;
  float T = uTime;
  float R = 0.27;
  float r = length(p);
  vec2 m = uMouse;

  // backdrop
  vec3 col = vec3(0.006, 0.007, 0.014);
  col += vec3(0.015, 0.030, 0.070) * exp(-r * r * 4.0);

  // faint HUD dot grid
  vec2 gp = fract((p + m * 0.01) * 26.0) - 0.5;
  col += vec3(0.25, 0.5, 0.9) * (1.0 - smoothstep(0.04, 0.09, length(gp)))
       * 0.10 * exp(-r * r * 5.0) * smoothstep(R, R * 1.25, r);

  // aura outside the shell
  float outside = smoothstep(R * 0.985, R * 1.01, r);
  float ao = max(r - R, 0.0);
  col += sci(atan(p.y, p.x) / TAU + T * 0.04)
       * (exp(-ao * 16.0) * 0.10 + exp(-ao * 5.0) * 0.03) * (0.85 + uKick * 0.8) * outside;

  // orb
  col += orb(p, R);

  // rings
  mat3 M1 = rotZ( 0.5 + T * 0.05 + m.x * 0.20) * rotX(0.62 + 0.06 * sin(T * 0.37) + m.y * 0.12);
  mat3 M2 = rotZ(-0.9 - T * 0.04 + m.x * 0.15) * rotX(0.42 + 0.05 * sin(T * 0.29 + 1.0) - m.y * 0.10);
  mat3 M3 = rotZ( 2.2 + T * 0.03)              * rotX(0.95 + 0.08 * sin(T * 0.23 + 2.0) + m.y * 0.10);
  col += ring(p, M1, 0.360, 0.0022,  0.80,  72.0,  0.0, vec3(0.30, 0.90, 1.00), R);
  col += ring(p, M2, 0.415, 0.0016, -0.60, 120.0,  0.0, vec3(0.70, 0.40, 1.00), R);
  col += ring(p, M3, 0.455, 0.0030,  0.45,   0.0, 14.0, vec3(1.00, 0.35, 0.75), R);

  // tap shockwave
  float amp = exp(-uPulse * 1.7);
  float wd = (r - (R + uPulse * 0.8)) * 40.0;
  col += vec3(0.35, 0.85, 1.0) * exp(-wd * wd) * amp * 1.3;

  // anamorphic lens streak
  float streak = exp(-abs(p.y) * 90.0) * exp(-abs(p.x) * 2.8);
  col += vec3(0.25, 0.60, 1.0) * streak * (0.07 + 0.25 * uKick) * (0.9 + 0.1 * sin(T * 2.2));

  // grade
  col *= 1.0 - 0.45 * smoothstep(0.35, 1.2, r);
  col = 1.0 - exp(-col * 1.5);

  // dither against banding
  float dn = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  col += (dn - 0.5) / 255.0;

  gl_FragColor = vec4(col, 1.0);
}
`;

// ---------- no-WebGL fallback ----------
if (!PIXI.utils.isWebGLSupported()) {
  document.body.style.background =
    'radial-gradient(circle at 50% 45%, #0a2a44, #020204 60%)';
  throw new Error('WebGL unsupported');
}

PIXI.settings.PRECISION_FRAGMENT = PIXI.PRECISION.HIGH;

// ---------- baked smooth noise texture (tileable) ----------
function makeNoiseTexture(size = 256, cells = 16) {
  const g = Array.from({ length: cells * cells }, Math.random);
  const data = new Uint8Array(size * size * 4);
  const s = t => t * t * (3 - 2 * t);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const fx = x / size * cells, fy = y / size * cells;
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = s(fx - x0), ty = s(fy - y0);
      const x1 = (x0 + 1) % cells, y1 = (y0 + 1) % cells;
      const v = (g[y0*cells+x0]*(1-tx) + g[y0*cells+x1]*tx) * (1-ty)
              + (g[y1*cells+x0]*(1-tx) + g[y1*cells+x1]*tx) * ty;
      const i = (y * size + x) * 4;
      data[i] = data[i+1] = data[i+2] = v * 255;
      data[i+3] = 255;
    }
  }
  return PIXI.Texture.fromBuffer(data, size, size, {
    scaleMode: PIXI.SCALE_MODES.LINEAR,
    wrapMode: PIXI.WRAP_MODES.REPEAT,
    mipmap: PIXI.MIPMAP_MODES.OFF,
  });
}

// ---------- app ----------
const app = new PIXI.Application({
  resizeTo: window,
  backgroundColor: 0x020204,
  antialias: false,
  resolution: Math.min(window.devicePixelRatio || 1, 2),
  autoDensity: true,
});
document.body.appendChild(app.view);

const filter = new PIXI.Filter(undefined, frag, {
  uTime: 0,
  uRes: [app.screen.width, app.screen.height],
  uMouse: [0, 0],
  uKick: 0,
  uPulse: 99,
  uNoise: makeNoiseTexture(),
});

const quad = new PIXI.Sprite(PIXI.Texture.WHITE);
quad.filters = [filter];
app.stage.addChild(quad);

function layout() {
  quad.width = app.screen.width;
  quad.height = app.screen.height;
  filter.uniforms.uRes = [app.screen.width, app.screen.height];
}
layout();
app.renderer.on('resize', layout);

// ---------- interaction ----------
const target = [0, 0];
let active = false;
function setTarget(e) {
  active = true;
  target[0] = (e.clientX / innerWidth - 0.5) * 2;
  target[1] = -(e.clientY / innerHeight - 0.5) * 2;
}
app.view.addEventListener('pointermove', setTarget);
app.view.addEventListener('pointerdown', (e) => {
  setTarget(e);
  filter.uniforms.uKick = 1;
  filter.uniforms.uPulse = 0;
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  app.view.addEventListener(ev, () => { active = false; }));

app.ticker.add(() => {
  const dt = app.ticker.deltaMS / 1000;
  const u = filter.uniforms;
  u.uTime += dt;
  u.uKick *= Math.pow(0.05, dt);
  u.uPulse = Math.min(u.uPulse + dt, 99);

  // idle drift so it's alive without touch
  if (!active) {
    target[0] = Math.sin(u.uTime * 0.30) * 0.45;
    target[1] = Math.cos(u.uTime * 0.23) * 0.30;
  }
  const m = u.uMouse;
  u.uMouse = [m[0] + (target[0] - m[0]) * 0.04, m[1] + (target[1] - m[1]) * 0.04];
});
</script>
</body>
</html>

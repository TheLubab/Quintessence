<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>adapt</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060d14;
      }

      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #canvas:focus-visible {
        outline: 2px solid #77d9c1;
        outline-offset: -2px;
      }
    </style>

  </head>

  <body>
    <canvas
      id="canvas"
      tabindex="0"
      aria-label="Adapt workspace"
    ></canvas>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>

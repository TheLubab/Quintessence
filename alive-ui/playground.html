<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alive-ui playground</title>
  </head>
  <body>
    <main class="playground">
      <section class="playground-source">
        <h1>Alive playground</h1>
        <p>Run applies the script once. There is no model here.</p>
        <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
        <button id="run" type="button">Run</button>
      </section>
      <section class="playground-result">
        <h2>Preview</h2>
        <div id="preview"></div>
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="/src/playground.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contextual image edits</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #090a0c;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
</style>
</head>
<body>
<canvas id="c1" role="img" aria-label="An image with text-only editing suggestions orbiting it. Hover a suggestion to preview the edit. Click to apply. Drop an image to replace the current one and generate new suggestions."></canvas>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c1');
  const ctx = cv.getContext('2d');
  const SANS = '"Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
  const SERIF = '"Iowan Old Style", "Charter", "Palatino Linotype", Georgia, serif';
  const INK = '#efeae0';
  const MUTED = '#8d897f';
  const ACCENT = '#e9c675';
  const BG = '#090a0c';
  const LINE = 'rgba(239,234,224,0.14)';
  const TAU = Math.PI * 2;
  const isCoarse = window.matchMedia('(pointer: coarse)').matches;
  const HINT = isCoarse
    ? 'tap a suggestion to apply'
    : 'drop an image · drag the ring · hover a suggestion';

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);

  function rgba(hex, alpha) {
    const clean = hex.replace('#', '');
    const n = parseInt(clean, 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }

  function makeDefaultImage() {
    const canvas = document.createElement('canvas');
    canvas.width = 1100;
    canvas.height = 760;
    const g = canvas.getContext('2d');

    const sky = g.createLinearGradient(0, 0, 0, 520);
    sky.addColorStop(0, '#26324c');
    sky.addColorStop(0.55, '#7b6d7f');
    sky.addColorStop(1, '#e6a271');
    g.fillStyle = sky;
    g.fillRect(0, 0, 1100, 760);

    const sunX = 742;
    const sunY = 248;
    const glow = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, 200);
    glow.addColorStop(0, 'rgba(255,226,181,0.38)');
    glow.addColorStop(0.4, 'rgba(255,226,181,0.12)');
    glow.addColorStop(1, 'rgba(255,226,181,0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, 1100, 760);

    g.fillStyle = '#ffe2b3';
    g.beginPath();
    g.arc(sunX, sunY, 64, 0, TAU);
    g.fill();

    g.fillStyle = '#6e778b';
    g.beginPath();
    g.moveTo(0, 500);
    g.quadraticCurveTo(240, 366, 470, 470);
    g.quadraticCurveTo(720, 580, 1100, 438);
    g.lineTo(1100, 760);
    g.lineTo(0, 760);
    g.closePath();
    g.fill();

    g.fillStyle = '#3e4a5e';
    g.beginPath();
    g.moveTo(0, 555);
    g.quadraticCurveTo(230, 452, 470, 534);
    g.quadraticCurveTo(760, 630, 1100, 500);
    g.lineTo(1100, 760);
    g.lineTo(0, 760);
    g.closePath();
    g.fill();

    const water = g.createLinearGradient(0, 510, 0, 760);
    water.addColorStop(0, '#394b5e');
    water.addColorStop(1, '#111a23');
    g.fillStyle = water;
    g.fillRect(0, 510, 1100, 250);

    g.save();
    g.translate(sunX, 565);
    g.scale(0.15, 0.55);
    const reflection = g.createRadialGradient(0, 0, 0, 0, 0, 300);
    reflection.addColorStop(0, 'rgba(255,224,180,0.3)');
    reflection.addColorStop(1, 'rgba(255,224,180,0)');
    g.fillStyle = reflection;
    g.beginPath();
    g.arc(0, 0, 300, 0, TAU);
    g.fill();
    g.restore();

    g.fillStyle = '#1b2530';
    g.beginPath();
    g.moveTo(0, 680);
    g.quadraticCurveTo(300, 610, 560, 690);
    g.quadraticCurveTo(820, 760, 1100, 650);
    g.lineTo(1100, 760);
    g.lineTo(0, 760);
    g.closePath();
    g.fill();

    const vignette = g.createRadialGradient(550, 380, 220, 550, 380, 760);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.34)');
    g.fillStyle = vignette;
    g.fillRect(0, 0, 1100, 760);

    return canvas;
  }

  function analyzeImage(source) {
    const sample = document.createElement('canvas');
    sample.width = 64;
    sample.height = 64;
    const g = sample.getContext('2d', { willReadFrequently: true });
    try {
      g.drawImage(source, 0, 0, 64, 64);
      const data = g.getImageData(0, 0, 64, 64).data;
      let lumaSum = 0;
      let lumaSquare = 0;
      let saturation = 0;
      let warmth = 0;
      let count = 0;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i] / 255;
        const gr = data[i + 1] / 255;
        const b = data[i + 2] / 255;
        const high = Math.max(r, gr, b);
        const low = Math.min(r, gr, b);
        const luma = 0.2126 * r + 0.7152 * gr + 0.0722 * b;
        lumaSum += luma;
        lumaSquare += luma * luma;
        saturation += high === 0 ? 0 : (high - low) / high;
        warmth += r - b;
        count += 1;
      }
      const mean = lumaSum / count;
      const variance = Math.max(0, lumaSquare / count - mean * mean);
      return {
        luma: mean,
        saturation: saturation / count,
        warmth: warmth / count,
        contrast: Math.sqrt(variance),
        aspect: source.width / source.height || 1
      };
    } catch (error) {
      return { luma: 0.45, saturation: 0.35, warmth: 0.02, contrast: 0.2, aspect: 1 };
    }
  }

  function makeReading(stats) {
    const parts = [];
    parts.push(stats.luma < 0.34 ? 'LOW LIGHT' : stats.luma > 0.64 ? 'BRIGHT FRAME' : 'EVEN LIGHT');
    parts.push(stats.warmth < -0.025 ? 'COOL CAST' : stats.warmth > 0.05 ? 'WARM CAST' : 'NEUTRAL COLOR');
    if (stats.saturation < 0.2) parts.push('MUTED COLOR');
    else if (stats.saturation > 0.45) parts.push('RICH COLOR');
    else parts.push('QUIET COLOR');
    if (stats.aspect > 1.25) parts.push('WIDE FRAME');
    else if (stats.aspect < 0.82) parts.push('TALL FRAME');
    else parts.push('SQUARE FRAME');
    return parts.slice(0, 3).join(' · ');
  }

  function makeSuggestions(stats) {
    const candidates = [
      {
        id: 'lift',
        label: 'Lift the shadows',
        note: 'The lower half is carrying too much weight.',
        filter: 'brightness(1.22) contrast(0.93)',
        score: stats.luma < 0.42 ? 3 : 0.3
      },
      {
        id: 'warm',
        label: 'Warm the light',
        note: 'The cast is leaning cool.',
        filter: 'sepia(0.3) saturate(1.18) brightness(1.04)',
        score: stats.warmth < 0.015 ? 2.6 : 0.4
      },
      {
        id: 'quiet',
        label: 'Quiet the color',
        note: 'The color is louder than the frame.',
        filter: 'saturate(0.6) contrast(0.97)',
        score: stats.saturation > 0.4 ? 2.4 : 0.45
      },
      {
        id: 'crop',
        label: 'Crop closer',
        note: 'The edges are not earning their place.',
        zoom: 1.26,
        score: stats.aspect > 1.2 || stats.aspect < 0.85 ? 2.5 : 0.5
      },
      {
        id: 'mono',
        label: 'Go black and white',
        note: 'Look at the structure instead.',
        filter: 'grayscale(1) contrast(1.1)',
        score: stats.saturation > 0.3 ? 1.5 : 0.6
      },
      {
        id: 'deepen',
        label: 'Deepen the contrast',
        note: 'The midtones feel flat.',
        filter: 'contrast(1.22) saturate(1.05)',
        score: stats.contrast < 0.2 ? 2.2 : 0.5
      },
      {
        id: 'soften',
        label: 'Soften the frame',
        note: 'Everything is asking for the same attention.',
        filter: 'saturate(0.84) contrast(0.85) brightness(1.05)',
        score: stats.contrast > 0.3 ? 1.8 : 0.3
      }
    ];

    return candidates
      .sort((a, b) => b.score - a.score)
      .slice(0, 5)
      .map((suggestion, index) => ({
        ...suggestion,
        angle: -Math.PI / 2 + (index * TAU) / 5,
        hover: 0
      }));
  }

  let image = null;
  let stats = null;
  let reading = '';
  let suggestions = [];
  let appliedId = null;
  let hovered = -1;
  let suppressHover = false;
  let rot = 0.08;
  let spin = 0;
  let dragging = false;
  let lastAngle = 0;
  let pulse = 0;
  let dropActive = false;
  let W = 0;
  let H = 0;
  let D = 1;
  let compact = false;
  let cx = 0;
  let cy = 0;
  let imageR = 0;
  let orbitR = 0;
  let listTop = 0;
  let actionViews = [];
  let pointer = { x: -999, y: -999, in: false };
  let status = '';
  let statusUntil = 0;
  let lastFrame = performance.now();

  function setStatus(text, duration = 2100) {
    status = text;
    statusUntil = performance.now() + duration;
  }

  function useImage(source, notify) {
    image = source;
    stats = analyzeImage(source);
    reading = makeReading(stats);
    suggestions = makeSuggestions(stats);
    appliedId = null;
    hovered = -1;
    suppressHover = false;
    pulse = 1;
    if (notify) setStatus('image loaded · suggestions refreshed');
  }

  function currentEdit() {
    const applied = suggestions.find(item => item.id === appliedId) || null;
    const hover = hovered >= 0 ? suggestions[hovered] : null;
    if (hover && (!applied || hover.id !== applied.id)) {
      return { mode: 'preview', action: hover };
    }
    if (applied) return { mode: 'applied', action: applied };
    return { mode: 'none', action: null };
  }

  function activate(index) {
    const action = suggestions[index];
    if (!action) return;
    if (appliedId === action.id) {
      appliedId = null;
      setStatus('edit removed');
    } else {
      appliedId = action.id;
      setStatus(`${action.label.toLowerCase()} applied`);
    }
    suppressHover = true;
    pulse = 1;
  }

  function layoutScene() {
    D = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width = Math.round(W * D);
    cv.height = Math.round(H * D);
    compact = W < 820;
    cx = W * 0.5;
    if (compact) {
      imageR = clamp(W * 0.23, 70, 100);
      cy = H * 0.31;
      orbitR = imageR + 52;
    } else {
      imageR = clamp(Math.min(W, H) * 0.19, 100, 160);
      cy = H * 0.5 + 8;
      orbitR = imageR + clamp(Math.min(W, H) * 0.11, 78, 110);
    }
    listTop = compact ? cy + orbitR + 42 : 0;
  }

  function computeActionViews() {
    const views = [];
    if (compact) {
      const rowH = 28;
      suggestions.forEach((action, index) => {
        const angle = action.angle + rot;
        const nx = cx + Math.cos(angle) * orbitR;
        const ny = cy + Math.sin(angle) * orbitR;
        const rowCenter = listTop + index * rowH + rowH / 2;
        views.push({
          action,
          compact: true,
          nx,
          ny,
          rowCenter,
          box: { x: 28, y: rowCenter - rowH / 2 - 3, w: W - 56, h: rowH + 6 }
        });
      });
      return views;
    }

    suggestions.forEach(action => {
      const angle = action.angle + rot;
      const nx = cx + Math.cos(angle) * orbitR;
      const ny = cy + Math.sin(angle) * orbitR;
      const horizontal = Math.cos(angle);
      const vertical = Math.sin(angle);
      ctx.font = `500 12.5px ${SANS}`;
      const width = ctx.measureText(action.label).width;
      const height = 18;
      let align;
      let lx;
      let ly;
      if (Math.abs(horizontal) < 0.35) {
        align = 'center';
        lx = nx;
        ly = ny + (vertical < 0 ? -18 : 24);
      } else if (horizontal > 0) {
        align = 'left';
        lx = nx + 16;
        ly = ny + 1;
      } else {
        align = 'right';
        lx = nx - 16;
        ly = ny + 1;
      }
      let left = align === 'center' ? lx - width / 2 : align === 'right' ? lx - width : lx;
      left = clamp(left, 14, W - width - 14);
      lx = align === 'center' ? left + width / 2 : align === 'right' ? left + width : left;
      const top = ly - height / 2;
      views.push({
        action,
        compact: false,
        nx,
        ny,
        lx,
        ly,
        align,
        width,
        height,
        box: { x: left - 8, y: top - 6, w: width + 16, h: height + 12 }
      });
    });
    return views;
  }

  function update(now, step) {
    if (!dragging) {
      if (Math.abs(spin) > 0.0004) {
        rot += spin * step;
        spin *= Math.pow(0.94, step);
      } else {
        spin = 0;
      }
    }

    actionViews = computeActionViews();

    let nextHover = -1;
    let overAction = false;
    if (pointer.in) {
      for (let i = 0; i < actionViews.length; i += 1) {
        const box = actionViews[i].box;
        if (
          pointer.x >= box.x &&
          pointer.x <= box.x + box.w &&
          pointer.y >= box.y &&
          pointer.y <= box.y + box.h
        ) {
          overAction = true;
          if (!suppressHover) nextHover = i;
          break;
        }
      }
    }
    hovered = nextHover;
    suggestions.forEach((action, index) => {
      const target = index === hovered ? 1 : 0;
      action.hover += (target - action.hover) * Math.min(1, 0.2 * step);
    });

    pulse = Math.max(0, pulse - 0.03 * step);

    if (statusUntil && now > statusUntil) {
      status = '';
      statusUntil = 0;
    }

    const nearRing = pointer.in && !overAction && dist(pointer.x, pointer.y, cx, cy) < orbitR + 70;
    cv.style.cursor = overAction
      ? 'pointer'
      : dragging
        ? 'grabbing'
        : nearRing
          ? 'grab'
          : 'default';
  }

  function frame(now) {
    const step = clamp((now - lastFrame) / 16.667, 0.2, 2.2);
    lastFrame = now;
    update(now, step);
    draw(now);
    requestAnimationFrame(frame);
  }

  function fitText(text, maxWidth, font) {
    ctx.font = font;
    if (ctx.measureText(text).width <= maxWidth) return text;
    let clipped = text;
    while (clipped.length > 3 && ctx.measureText(`${clipped}…`).width > maxWidth) {
      clipped = clipped.slice(0, -1);
    }
    return `${clipped}…`;
  }

  function drawBackground() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    let glow = ctx.createRadialGradient(W * 0.78, H * 0.18, 0, W * 0.78, H * 0.18, Math.max(W, H) * 0.7);
    glow.addColorStop(0, rgba(ACCENT, 0.05));
    glow.addColorStop(0.55, rgba(ACCENT, 0.012));
    glow.addColorStop(1, rgba(ACCENT, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    glow = ctx.createRadialGradient(W * 0.14, H * 0.86, 0, W * 0.14, H * 0.86, Math.max(W, H) * 0.6);
    glow.addColorStop(0, 'rgba(88, 144, 139, 0.035)');
    glow.addColorStop(1, 'rgba(88, 144, 139, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  function drawImageObject() {
    if (!image) return;
    const r = imageR * (1 + pulse * 0.018);
    const edit = currentEdit();
    const active = edit.action;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.65)';
    ctx.shadowBlur = 70;
    ctx.shadowOffsetY = 24;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.fillStyle = '#050506';
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.clip();
    const zoom = active && active.zoom ? active.zoom : 1;
    const scale = Math.max((r * 2) / image.width, (r * 2) / image.height) * zoom;
    const dw = image.width * scale;
    const dh = image.height * scale;
    if (active && active.filter && 'filter' in ctx) ctx.filter = active.filter;
    ctx.drawImage(image, cx - dw / 2, cy - dh / 2, dw, dh);
    if ('filter' in ctx) ctx.filter = 'none';

    const vignette = ctx.createRadialGradient(cx, cy, r * 0.56, cx, cy, r * 1.02);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.34)');
    ctx.fillStyle = vignette;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.strokeStyle = rgba(INK, 0.22);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawOrbit() {
    const nearRing = pointer.in && Math.abs(dist(pointer.x, pointer.y, cx, cy) - orbitR) < 52;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, orbitR, 0, TAU);
    ctx.setLineDash([2, 7]);
    ctx.strokeStyle = dragging || nearRing ? rgba(ACCENT, 0.55) : rgba(INK, 0.17);
    ctx.lineWidth = dragging || nearRing ? 1.2 : 1;
    ctx.stroke();
    ctx.setLineDash([]);

    const applied = suggestions.find(item => item.id === appliedId);
    actionViews.forEach((view, index) => {
      const action = view.action;
      const hover = action.hover;
      const isApplied = applied && applied.id === action.id;
      const isHovered = index === hovered;
      const radius = 2.4 + hover * 2.6;
      if (isApplied) {
        ctx.beginPath();
        ctx.arc(view.nx, view.ny, 7, 0, TAU);
        ctx.strokeStyle = rgba(ACCENT, 0.28);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(view.nx, view.ny, radius, 0, TAU);
      ctx.fillStyle = isHovered || isApplied ? ACCENT : rgba(INK, 0.38);
      ctx.fill();
    });
    ctx.restore();

    if (!compact) {
      actionViews.forEach((view, index) => {
        const action = view.action;
        const hover = action.hover;
        const isApplied = applied && applied.id === action.id;
        const isHovered = index === hovered;
        ctx.save();
        ctx.font = `500 12.5px ${SANS}`;
        ctx.textAlign = view.align;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = isHovered
          ? ACCENT
          : isApplied
            ? rgba(ACCENT, 0.88)
            : rgba(INK, 0.74);
        ctx.fillText(action.label, view.lx, view.ly);

        if (isHovered || isApplied) {
          let left = view.align === 'center'
            ? view.lx - view.width / 2
            : view.align === 'right'
              ? view.lx - view.width
              : view.lx;
          ctx.beginPath();
          ctx.moveTo(left, view.ly + 10);
          ctx.lineTo(left + view.width, view.ly + 10);
          ctx.strokeStyle = rgba(ACCENT, isHovered ? 0.55 : 0.3);
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.restore();
      });
    } else {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `500 8.5px ${MONO}`;
      ctx.fillStyle = rgba(INK, 0.3);
      ctx.fillText('SUGGESTIONS', cx, listTop - 18);
      ctx.restore();

      actionViews.forEach((view, index) => {
        const action = view.action;
        const isApplied = applied && applied.id === action.id;
        const isHovered = index === hovered;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${isHovered ? '500' : '400'} 13px ${SANS}`;
        ctx.fillStyle = isHovered
          ? ACCENT
          : isApplied
            ? rgba(ACCENT, 0.88)
            : rgba(INK, 0.8);
        ctx.fillText(action.label, cx, view.rowCenter);
        if (isHovered || isApplied) {
          const width = ctx.measureText(action.label).width;
          ctx.beginPath();
          ctx.moveTo(cx - width / 2, view.rowCenter + 9);
          ctx.lineTo(cx + width / 2, view.rowCenter + 9);
          ctx.strokeStyle = rgba(ACCENT, isHovered ? 0.55 : 0.3);
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.restore();
      });
    }
  }

  function drawTopBlock() {
    const edit = currentEdit();
    let title;
    let note;
    let accent = false;

    if (edit.mode === 'preview' || edit.mode === 'applied') {
      title = `${edit.mode === 'preview' ? 'SUGGESTION' : 'APPLIED'} / ${edit.action.label.toUpperCase()}`;
      note = edit.action.note;
      accent = true;
    } else {
      title = `AI READ / ${reading}`;
      note = 'five edits suggested from this reading';
    }

    const x = compact ? 20 : 32;
    const metaY = compact ? 30 : 40;
    const maxWidth = compact ? W - 40 : Math.min(360, W * 0.34);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    ctx.font = `500 9px ${MONO}`;
    ctx.fillStyle = MUTED;
    ctx.fillText('CONTEXTUAL IMAGE / 03', x, metaY);

    const smallFont = `500 ${compact ? 8.5 : 9}px ${MONO}`;
    ctx.font = smallFont;
    ctx.fillStyle = accent ? ACCENT : rgba(INK, 0.48);
    ctx.fillText(fitText(title, maxWidth, smallFont), x, metaY + 22);

    ctx.font = accent
      ? `italic ${compact ? 11.5 : 12.5}px ${SERIF}`
      : `400 ${compact ? 11 : 11.5}px ${SANS}`;
    ctx.fillStyle = accent ? rgba(INK, 0.68) : rgba(INK, 0.36);
    ctx.fillText(fitText(note, maxWidth, ctx.font), x, metaY + 40);
  }

  function drawFooter(now) {
    const activeStatus = now < statusUntil;
    const text = activeStatus ? status : HINT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = `500 ${compact ? 8.5 : 9}px ${MONO}`;
    ctx.fillStyle = activeStatus ? ACCENT : rgba(INK, 0.34);
    ctx.fillText(text, W / 2, H - 22);
  }

  function drawDropState() {
    if (!dropActive) return;
    ctx.fillStyle = 'rgba(9,10,12,0.82)';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, imageR + 28, 0, TAU);
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = rgba(ACCENT, 0.7);
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `500 20px ${SERIF}`;
    ctx.fillStyle = INK;
    ctx.fillText('Drop an image', cx, cy - 8);
    ctx.font = `500 9px ${MONO}`;
    ctx.fillStyle = rgba(INK, 0.46);
    ctx.fillText('the suggestions will change with it', cx, cy + 18);
  }

  function draw(now) {
    ctx.setTransform(D, 0, 0, D, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawTopBlock();
    drawImageObject();
    drawOrbit();
    drawFooter(now);
    drawDropState();
  }

  function point(event) {
    const rect = cv.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  function actionAt(px, py) {
    for (let i = 0; i < actionViews.length; i += 1) {
      const box = actionViews[i].box;
      if (px >= box.x && px <= box.x + box.w && py >= box.y && py <= box.y + box.h) {
        return i;
      }
    }
    return -1;
  }

  function loadFile(file) {
    if (!file || !file.type || !file.type.startsWith('image/')) {
      setStatus('that file is not an image');
      return;
    }
    const url = URL.createObjectURL(file);
    const next = new Image();
    next.onload = () => {
      URL.revokeObjectURL(url);
      useImage(next, true);
    };
    next.onerror = () => {
      URL.revokeObjectURL(url);
      setStatus('could not read that image');
    };
    next.src = url;
  }

  cv.addEventListener('pointerdown', event => {
    event.preventDefault();
    const p = point(event);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.in = true;

    const index = actionAt(p.x, p.y);
    if (index >= 0) {
      activate(index);
      return;
    }

    if (dist(p.x, p.y, cx, cy) < orbitR + 80) {
      dragging = true;
      spin = 0;
      lastAngle = Math.atan2(p.y - cy, p.x - cx);
      try {
        cv.setPointerCapture(event.pointerId);
      } catch (error) {
        void error;
      }
    }
  });

  cv.addEventListener('pointermove', event => {
    const p = point(event);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.in = true;

    if (dragging) {
      const angle = Math.atan2(p.y - cy, p.x - cx);
      const delta = Math.atan2(Math.sin(angle - lastAngle), Math.cos(angle - lastAngle));
      rot += delta;
      spin = clamp(delta * 0.8, -0.2, 0.2);
      lastAngle = angle;
    }
  });

  function endPointer(event) {
    dragging = false;
    try {
      cv.releasePointerCapture(event.pointerId);
    } catch (error) {
      void error;
    }
  }

  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('pointerleave', () => {
    pointer.in = false;
    pointer.x = -999;
    pointer.y = -999;
  });
  cv.addEventListener('contextmenu', event => event.preventDefault());

  window.addEventListener('dragenter', event => {
    if (event.dataTransfer && Array.from(event.dataTransfer.types).includes('Files')) {
      event.preventDefault();
      dropActive = true;
    }
  });

  window.addEventListener('dragover', event => {
    if (event.dataTransfer && Array.from(event.dataTransfer.types).includes('Files')) {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
      dropActive = true;
    }
  });

  window.addEventListener('dragleave', event => {
    if (!event.relatedTarget) dropActive = false;
  });

  window.addEventListener('drop', event => {
    event.preventDefault();
    dropActive = false;
    const file = Array.from(event.dataTransfer.files || []).find(item => item.type.startsWith('image/'));
    if (file) loadFile(file);
  });

  window.addEventListener('paste', event => {
    const items = event.clipboardData ? Array.from(event.clipboardData.items) : [];
    const imageItem = items.find(item => item.type.startsWith('image/'));
    if (imageItem) {
      event.preventDefault();
      loadFile(imageItem.getAsFile());
    }
  });

  window.addEventListener('resize', layoutScene);
  window.addEventListener('orientationchange', layoutScene);

  layoutScene();
  useImage(makeDefaultImage(), false);
  const start = performance.now();
  update(start, 1);
  draw(start);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas primitives</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #090a0c;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
</style>
</head>
<body>
<canvas id="a1" role="img" aria-label="Interactive canvas. Five actions orbit a photograph. Four photographs form an elastic contact sheet. A dot field responds to the pointer."></canvas>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('a1');
  const ctx = cv.getContext('2d');
  const cs = getComputedStyle(cv);
  const theme = (name, fallback) => cs.getPropertyValue(name).trim() || fallback;
  const ink = theme('--text-primary', '#efece4');
  const sec = theme('--text-secondary', '#8b8780');
  const surf = theme('--surface-2', '#17181b');
  const acc = theme('--fill-accent', '#e6c777');
  const on = theme('--on-accent', '#17130b');
  const bg = theme('--surface-0', '#090a0c');
  const ff = cs.fontFamily || 'ui-sans-serif, system-ui, sans-serif';
  const TAU = Math.PI * 2;
  const HINT = 'drag the ring · hover an action · click a frame';

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);

  function rgba(hex, alpha) {
    const clean = hex.replace('#', '');
    const n = parseInt(clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean, 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }

  const PHOTOS = [
    {
      title: 'Dolomites', meta: '06:14 · 35MM', seed: 11,
      skyA: '#28324c', skyB: '#e7a26e', sun: '#ffe2b3',
      hillA: '#727c8e', hillB: '#414d62', waterA: '#26323f', waterB: '#101820'
    },
    {
      title: 'Atlantic', meta: '05:48 · 50MM', seed: 29,
      skyA: '#35414b', skyB: '#c8cec5', sun: '#f7eedb',
      hillA: '#83918f', hillB: '#4d5f5d', waterA: '#2d3d3f', waterB: '#0d191b'
    },
    {
      title: 'Atlas', meta: '17:32 · 28MM', seed: 43,
      skyA: '#392b40', skyB: '#e19a73', sun: '#ffd6a0',
      hillA: '#a3796d', hillB: '#6d4b4f', waterA: '#5a3e42', waterB: '#21171f'
    },
    {
      title: 'Calanques', meta: '21:07 · 50MM', seed: 71,
      skyA: '#1b223a', skyB: '#7e6a8e', sun: '#f6d4a3',
      hillA: '#5c5c7d', hillB: '#393a5c', waterA: '#272c47', waterB: '#0d1123'
    }
  ];

  PHOTOS.forEach(photo => {
    photo.cropped = false;
    photo.enhanced = false;
    photo.favorite = false;
    photo.captioned = false;
  });

  const ACTIONS = [
    { name: 'Crop', icon: 0, id: 'crop' },
    { name: 'Enhance', icon: 1, id: 'enhance' },
    { name: 'Share', icon: 2, id: 'share' },
    { name: 'Caption', icon: 3, id: 'caption' },
    { name: 'Favorite', icon: 4, id: 'favorite' }
  ];

  const nodes = ACTIONS.map((action, index) => ({
    ...action, index, x: 0, y: 0, vx: 0, vy: 0, s: 24, vs: 0, ready: false
  }));

  const thumbs = PHOTOS.map((photo, index) => ({
    photo, slot: index, x: 0, y: 0, vx: 0, vy: 0, s: 32, ready: false
  }));

  const pointer = { x: -999, y: -999, in: false };
  const ripples = [];

  let W = 0;
  let H = 0;
  let D = 1;
  let layout = null;
  let dots = [];
  let field = 0;
  let active = 0;
  let rot = -Math.PI / 2;
  let spin = 0;
  let dragging = false;
  let lastAngle = 0;
  let hot = -1;
  let hotThumb = -1;
  let dragThumb = null;
  let photoK = 1;
  let status = HINT;
  let statusUntil = 0;
  let lastTime = performance.now();

  function icon(c, kind, px, py, size, color) {
    c.save();
    c.translate(px, py);
    c.scale(size / 12, size / 12);
    c.strokeStyle = color;
    c.lineWidth = 1.6;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.beginPath();
    switch (kind) {
      case 0:
        c.moveTo(-5, -9); c.lineTo(-5, 5); c.lineTo(9, 5);
        c.moveTo(5, 9); c.lineTo(5, -5); c.lineTo(-9, -5);
        break;
      case 1:
        c.moveTo(0, -9); c.lineTo(2, -2); c.lineTo(9, 0); c.lineTo(2, 2);
        c.lineTo(0, 9); c.lineTo(-2, 2); c.lineTo(-9, 0); c.lineTo(-2, -2); c.closePath();
        break;
      case 2:
        c.arc(-6, 0, 2.5, 0, TAU); c.moveTo(8.5, -6); c.arc(6, -6, 2.5, 0, TAU);
        c.moveTo(8.5, 6); c.arc(6, 6, 2.5, 0, TAU); c.moveTo(-3.7, -1.3); c.lineTo(3.7, -4.7);
        c.moveTo(-3.7, 1.3); c.lineTo(3.7, 4.7);
        break;
      case 3:
        c.moveTo(-8, -5); c.lineTo(8, -5); c.moveTo(-8, 0); c.lineTo(8, 0); c.moveTo(-8, 5); c.lineTo(3, 5);
        break;
      case 4:
        c.moveTo(0, 7); c.bezierCurveTo(-12, -1, -6, -9, 0, -3);
        c.bezierCurveTo(6, -9, 12, -1, 0, 7);
        break;
    }
    c.stroke();
    c.restore();
  }

  function layoutScene() {
    const compact = W < 760;
    const pr = clamp(Math.min(W, H) * (compact ? 0.18 : 0.2), 64, 150);
    const cx = compact ? W * 0.5 : W * 0.43;
    const cy = compact ? H * 0.36 : H * 0.52;
    const orbitR = pr + (compact ? 72 : clamp(Math.min(W, H) * 0.14, 86, 118));
    const thumbR = compact ? clamp(W * 0.07, 22, 30) : clamp(W * 0.026, 28, 36);
    const slots = [];

    if (compact) {
      const gap = Math.min(86, (W - 64) / (PHOTOS.length - 1));
      const startX = W / 2 - (gap * (PHOTOS.length - 1)) / 2;
      PHOTOS.forEach((photo, i) => {
        slots.push({ x: startX + i * gap, y: H * 0.76 + Math.sin(i * 1.6) * 4 });
      });
    } else {
      const tx = W - clamp(W * 0.16, 150, 220);
      const gap = clamp(Math.min(H * 0.12, 104), 72, 104);
      PHOTOS.forEach((photo, i) => {
        slots.push({ x: tx + Math.sin(i * 1.7 + 0.4) * 14, y: H * 0.5 + (i - 1.5) * gap });
      });
    }

    layout = { compact, pr, cx, cy, orbitR, thumbR, slots };
    thumbs.forEach((thumb, i) => {
      if (!thumb.ready) {
        thumb.x = slots[i].x;
        thumb.y = slots[i].y;
        thumb.s = thumbR;
        thumb.ready = true;
      }
    });
  }

  function buildDots() {
    dots = [];
    const gap = layout.compact ? 28 : 38;
    for (let y = 18; y < H; y += gap) {
      for (let px = 20; px < W; px += gap) {
        dots.push({
          x: px + Math.sin(px * 0.61 + y * 0.37) * 2,
          y: y + Math.cos(px * 0.29 - y * 0.53) * 2
        });
      }
    }
  }

  function fit() {
    D = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width = Math.round(W * D);
    cv.height = Math.round(H * D);
    layoutScene();
    buildDots();
  }

  function setStatus(text, duration = 2200) {
    status = text;
    statusUntil = performance.now() + duration;
  }

  function nodeAt(px, py) {
    let found = -1;
    let best = Infinity;
    nodes.forEach((node, i) => {
      const d = dist(px, py, node.x, node.y);
      if (d < node.s + 8 && d < best) {
        found = i;
        best = d;
      }
    });
    return found;
  }

  function thumbAt(px, py) {
    let found = -1;
    let best = Infinity;
    thumbs.forEach((thumb, i) => {
      const d = dist(px, py, thumb.x, thumb.y);
      if (d < thumb.s + 8 && d < best) {
        found = i;
        best = d;
      }
    });
    return found;
  }

  function stateOf(id) {
    const photo = PHOTOS[active];
    if (id === 'crop') return photo.cropped;
    if (id === 'enhance') return photo.enhanced;
    if (id === 'favorite') return photo.favorite;
    if (id === 'caption') return photo.captioned;
    return false;
  }

  function activate(index) {
    const node = nodes[index];
    const photo = PHOTOS[active];
    if (node.id === 'crop') {
      photo.cropped = !photo.cropped;
      setStatus(photo.cropped ? 'crop guides on' : 'crop guides off');
    } else if (node.id === 'enhance') {
      photo.enhanced = !photo.enhanced;
      setStatus(photo.enhanced ? 'enhanced' : 'original');
    } else if (node.id === 'share') {
      setStatus(`${photo.title.toLowerCase()} · share link ready`);
    } else if (node.id === 'caption') {
      photo.captioned = !photo.captioned;
      setStatus(photo.captioned ? 'caption shown' : 'caption hidden');
    } else if (node.id === 'favorite') {
      photo.favorite = !photo.favorite;
      setStatus(photo.favorite ? 'added to favorites' : 'removed from favorites');
    }
    ripples.push({ x: node.x, y: node.y, t: performance.now() });
    node.vs += 6;
  }

  function selectThumb(thumb) {
    const index = PHOTOS.indexOf(thumb.photo);
    if (index !== active) {
      active = index;
      photoK = 0.965;
    }
    ripples.push({ x: layout.cx, y: layout.cy, t: performance.now(), big: true });
    setStatus(`${thumb.photo.title.toLowerCase()} in view`);
  }

  function reorderThumbs() {
    const ordered = [...thumbs].sort((a, b) => (
      layout.compact ? a.x - b.x : a.y - b.y
    ));
    ordered.forEach((thumb, i) => {
      thumb.slot = i;
    });
  }

  function update(now, step) {
    field += ((pointer.in ? 1 : 0) - field) * 0.08 * step;

    if (!dragging) {
      if (Math.abs(spin) > 0.0002) {
        rot += spin * step;
        spin *= Math.pow(0.94, step);
      } else {
        spin = 0;
      }
    }

    hot = -1;
    if (pointer.in && !dragging && !dragThumb) {
      for (let i = 0; i < nodes.length; i += 1) {
        if (dist(pointer.x, pointer.y, nodes[i].x, nodes[i].y) < nodes[i].s + 8) {
          hot = i;
          break;
        }
      }
    }

    nodes.forEach((node, i) => {
      const angle = rot + (i * TAU) / nodes.length;
      const baseX = layout.cx + Math.cos(angle) * layout.orbitR;
      const baseY = layout.cy + Math.sin(angle) * layout.orbitR;
      if (!node.ready) {
        node.x = baseX;
        node.y = baseY;
        node.ready = true;
      }
      const near = pointer.in && !dragging
        ? Math.max(0, 1 - dist(pointer.x, pointer.y, baseX, baseY) / 110)
        : 0;
      const tx = baseX + (pointer.x - baseX) * near * 0.25;
      const ty = baseY + (pointer.y - baseY) * near * 0.25;
      node.vx = (node.vx + (tx - node.x) * 0.16 * step) * Math.pow(0.72, step);
      node.vy = (node.vy + (ty - node.y) * 0.16 * step) * Math.pow(0.72, step);
      node.x += node.vx;
      node.y += node.vy;
      const targetSize = 24 + near * 6 + (hot === i ? 9 : 0);
      node.vs = (node.vs + (targetSize - node.s) * 0.22 * step) * Math.pow(0.68, step);
      node.s += node.vs;
    });

    hotThumb = -1;
    if (dragThumb && dragThumb.moved) {
      hotThumb = thumbs.indexOf(dragThumb.thumb);
    } else if (pointer.in && !dragging) {
      for (let i = 0; i < thumbs.length; i += 1) {
        if (dist(pointer.x, pointer.y, thumbs[i].x, thumbs[i].y) < thumbs[i].s + 8) {
          hotThumb = i;
          break;
        }
      }
    }

    const pushes = thumbs.map(() => ({ x: 0, y: 0 }));
    for (let i = 0; i < thumbs.length; i += 1) {
      for (let j = i + 1; j < thumbs.length; j += 1) {
        const a = thumbs[i];
        const b = thumbs[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const min = layout.thumbR * 2 + 12;
        if (d > 0.001 && d < min) {
          const force = ((min - d) / min) * 9;
          pushes[i].x -= (dx / d) * force;
          pushes[i].y -= (dy / d) * force;
          pushes[j].x += (dx / d) * force;
          pushes[j].y += (dy / d) * force;
        }
      }
    }

    thumbs.forEach((thumb, i) => {
      const slot = layout.slots[thumb.slot];
      let tx = slot.x;
      let ty = slot.y;

      if (dragThumb && dragThumb.thumb === thumb && dragThumb.moved) {
        thumb.x = pointer.x - dragThumb.dx;
        thumb.y = pointer.y - dragThumb.dy;
        thumb.vx = 0;
        thumb.vy = 0;
      } else {
        if (pointer.in && !dragging && hotThumb !== i) {
          const dx = thumb.x - pointer.x;
          const dy = thumb.y - pointer.y;
          const d = Math.hypot(dx, dy);
          if (d > 0.001 && d < 92) {
            const force = (1 - d / 92) * 12;
            tx += (dx / d) * force;
            ty += (dy / d) * force;
          }
        }
        tx += pushes[i].x;
        ty += pushes[i].y;
        thumb.vx = (thumb.vx + (tx - thumb.x) * 0.12 * step) * Math.pow(0.74, step);
        thumb.vy = (thumb.vy + (ty - thumb.y) * 0.12 * step) * Math.pow(0.74, step);
        thumb.x += thumb.vx;
        thumb.y += thumb.vy;
      }

      const targetSize = layout.thumbR
        + (hotThumb === i ? 5 : 0)
        + (PHOTOS[active] === thumb.photo ? 2 : 0)
        + (dragThumb && dragThumb.thumb === thumb && dragThumb.moved ? 4 : 0);
      thumb.s += (targetSize - thumb.s) * (1 - Math.pow(0.8, step));
    });

    const photoHover = pointer.in && dist(pointer.x, pointer.y, layout.cx, layout.cy) < layout.pr + 18;
    const targetK = 1 + (photoHover ? 0.007 : 0) + (dragging ? 0.004 : 0);
    photoK += (targetK - photoK) * (1 - Math.pow(0.86, step));

    if (statusUntil && now > statusUntil) {
      status = HINT;
      statusUntil = 0;
    }

    const dCenter = dist(pointer.x, pointer.y, layout.cx, layout.cy);
    const canGrab = pointer.in && !dragging && !dragThumb
      && dCenter > layout.pr * 0.9 && dCenter < layout.orbitR + 80;
    cv.style.cursor = (dragging || (dragThumb && dragThumb.moved))
      ? 'grabbing'
      : (hot >= 0 || hotThumb >= 0)
        ? 'pointer'
        : canGrab
          ? 'grab'
          : 'default';
  }

  function drawBackground() {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    let glow = ctx.createRadialGradient(W * 0.78, H * 0.2, 0, W * 0.78, H * 0.2, Math.max(W, H) * 0.7);
    glow.addColorStop(0, rgba(acc, 0.055));
    glow.addColorStop(0.55, rgba(acc, 0.014));
    glow.addColorStop(1, rgba(acc, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    glow = ctx.createRadialGradient(W * 0.12, H * 0.86, 0, W * 0.12, H * 0.86, Math.max(W, H) * 0.55);
    glow.addColorStop(0, 'rgba(91, 151, 143, 0.04)');
    glow.addColorStop(1, 'rgba(91, 151, 143, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  function drawDots() {
    ctx.fillStyle = rgba(sec, 0.16);
    ctx.beginPath();
    for (const dot of dots) {
      ctx.moveTo(dot.x + 0.75, dot.y);
      ctx.arc(dot.x, dot.y, 0.75, 0, TAU);
    }
    ctx.fill();

    if (field < 0.01) return;
    const range = layout.compact ? 105 : 145;
    for (const dot of dots) {
      const dx = dot.x - pointer.x;
      const dy = dot.y - pointer.y;
      const d = Math.hypot(dx, dy);
      if (d >= range) continue;
      const influence = Math.pow(1 - d / range, 2) * field;
      const shift = influence * 7;
      ctx.fillStyle = rgba(sec, 0.16 + influence * 0.42);
      ctx.beginPath();
      ctx.arc(
        dot.x + (d > 0.001 ? (dx / d) * shift : 0),
        dot.y + (d > 0.001 ? (dy / d) * shift : 0),
        0.75 + influence * 1.7,
        0,
        TAU
      );
      ctx.fill();
    }
  }

  function drawArt(px, py, r, photo) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(px, py, r, 0, TAU);
    ctx.clip();
    ctx.translate(px, py);

    if (photo.enhanced && 'filter' in ctx) {
      ctx.filter = 'saturate(1.38) contrast(1.05)';
    }

    const horizon = r * 0.1;
    const sky = ctx.createLinearGradient(0, -r, 0, horizon);
    sky.addColorStop(0, photo.skyA);
    sky.addColorStop(1, photo.skyB);
    ctx.fillStyle = sky;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    const sunX = (photo.seed % 5 - 2) * r * 0.16;
    const sunY = -r * 0.3;
    const sunR = r * 0.13;
    let glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, r * 0.6);
    glow.addColorStop(0, rgba(photo.sun, 0.34));
    glow.addColorStop(0.35, rgba(photo.sun, 0.12));
    glow.addColorStop(1, rgba(photo.sun, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    ctx.fillStyle = photo.sun;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, TAU);
    ctx.fill();

    const ridge = (base, amp, color, phase) => {
      ctx.beginPath();
      ctx.moveTo(-r * 1.2, r * 1.2);
      for (let i = 0; i <= 64; i += 1) {
        const t = i / 64;
        const x = (-1.2 + t * 2.4) * r;
        const y = (base + Math.sin(t * 7 + phase) * amp + Math.sin(t * 17 + phase * 1.7) * amp * 0.35) * r;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(r * 1.2, r * 1.2);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    };

    ridge(0.13, 0.12, photo.hillA, photo.seed * 0.4);
    ridge(0.27, 0.075, photo.hillB, photo.seed * 0.7 + 2);

    const water = ctx.createLinearGradient(0, horizon, 0, r);
    water.addColorStop(0, photo.waterA);
    water.addColorStop(1, photo.waterB);
    ctx.fillStyle = water;
    ctx.fillRect(-r, horizon, r * 2, r * 2);

    ctx.save();
    ctx.translate(sunX, horizon + r * 0.2);
    ctx.scale(0.11, 0.5);
    glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.5);
    glow.addColorStop(0, rgba(photo.sun, 0.38));
    glow.addColorStop(0.5, rgba(photo.sun, 0.1));
    glow.addColorStop(1, rgba(photo.sun, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.5, 0, TAU);
    ctx.fill();
    ctx.restore();

    for (let i = 0; i < 8; i += 1) {
      const y = horizon + ((i + 1) / 9) * r * 0.8;
      const width = r * (0.12 + Math.abs(Math.sin(photo.seed + i)) * 0.26);
      ctx.fillStyle = rgba(photo.sun, 0.06 + i * 0.005);
      ctx.fillRect(sunX - width / 2, y, width, 1);
    }

    ctx.beginPath();
    ctx.moveTo(-r, r * 0.56);
    ctx.quadraticCurveTo(-r * 0.3, r * 0.45, r * 0.15, r * 0.62);
    ctx.quadraticCurveTo(r * 0.65, r * 0.74, r, r * 0.58);
    ctx.lineTo(r, r * 1.2);
    ctx.lineTo(-r, r * 1.2);
    ctx.closePath();
    ctx.fillStyle = photo.waterB;
    ctx.fill();

    glow = ctx.createRadialGradient(0, 0, r * 0.35, 0, 0, r * 1.02);
    glow.addColorStop(0, 'rgba(0,0,0,0)');
    glow.addColorStop(0.75, 'rgba(0,0,0,0.06)');
    glow.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fill();

    if ('filter' in ctx) ctx.filter = 'none';
    ctx.restore();
  }

  function drawCrop(px, py, r) {
    const side = r * 1.36;
    const left = px - side / 2;
    const top = py - side / 2;
    ctx.save();
    ctx.beginPath();
    ctx.arc(px, py, r, 0, TAU);
    ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.24)';
    ctx.beginPath();
    ctx.arc(px, py, r, 0, TAU);
    ctx.rect(left, top, side, side);
    ctx.fill('evenodd');

    ctx.strokeStyle = rgba(ink, 0.3);
    ctx.lineWidth = 0.7;
    for (let i = 1; i < 3; i += 1) {
      const gx = left + (side * i) / 3;
      const gy = top + (side * i) / 3;
      ctx.beginPath();
      ctx.moveTo(gx, top);
      ctx.lineTo(gx, top + side);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(left, gy);
      ctx.lineTo(left + side, gy);
      ctx.stroke();
    }

    const corner = 14;
    ctx.strokeStyle = acc;
    ctx.lineWidth = 2;
    const corners = [
      [left, top, 1, 1],
      [left + side, top, -1, 1],
      [left, top + side, 1, -1],
      [left + side, top + side, -1, -1]
    ];
    for (const [x, y, sx, sy] of corners) {
      ctx.beginPath();
      ctx.moveTo(x + sx * corner, y);
      ctx.lineTo(x, y);
      ctx.lineTo(x, y + sy * corner);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPhoto(now) {
    const photo = PHOTOS[active];
    const r = layout.pr * photoK;
    const cx = layout.cx;
    const cy = layout.cy;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 60;
    ctx.shadowOffsetY = 20;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.fillStyle = '#050506';
    ctx.fill();
    ctx.restore();

    drawArt(cx, cy, r, photo);

    if (photo.cropped) drawCrop(cx, cy, r);

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.strokeStyle = rgba(ink, 0.3);
    ctx.lineWidth = 1;
    ctx.stroke();

    if (photo.favorite) {
      const bx = cx + Math.cos(-0.8) * (r + 1);
      const by = cy + Math.sin(-0.8) * (r + 1);
      ctx.beginPath();
      ctx.arc(bx, by, 10, 0, TAU);
      ctx.fillStyle = acc;
      ctx.fill();
      icon(ctx, 4, bx, by + 0.5, 13, on);
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(ink, 0.88);
    ctx.font = `500 13px ${ff}`;
    ctx.fillText(photo.title, cx, cy + r + (layout.compact ? 26 : 32));
    if (photo.captioned) {
      ctx.fillStyle = rgba(sec, 0.85);
      ctx.font = `10px ${ff}`;
      ctx.fillText(photo.meta, cx, cy + r + (layout.compact ? 42 : 49));
    }

    const t = now / 620;
    if (t < 1) {
      const pulse = Math.sin(t * Math.PI);
      ctx.beginPath();
      ctx.arc(cx, cy, r + pulse * 10, 0, TAU);
      ctx.strokeStyle = rgba(acc, (1 - t) * 0.3);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawThumbs() {
    if (thumbs.length > 1) {
      const pts = thumbs.map(t => ({ x: t.x, y: t.y }));
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i += 1) {
        const mx = (pts[i].x + pts[i + 1].x) / 2;
        const my = (pts[i].y + pts[i + 1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
      ctx.setLineDash([2, 7]);
      ctx.strokeStyle = rgba(sec, 0.22);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    const list = thumbs.slice().sort((a, b) => (
      (dragThumb && a === dragThumb.thumb && dragThumb.moved) ? 1
        : (dragThumb && b === dragThumb.thumb && dragThumb.moved) ? -1
          : 0
    ));

    for (const thumb of list) {
      const current = PHOTOS[active] === thumb.photo;
      const h = thumbs.indexOf(thumb) === hotThumb;
      const r = thumb.s;

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 22;
      ctx.shadowOffsetY = 10;
      ctx.beginPath();
      ctx.arc(thumb.x, thumb.y, r, 0, TAU);
      ctx.fillStyle = '#050506';
      ctx.fill();
      ctx.restore();

      drawArt(thumb.x, thumb.y, r, thumb.photo);

      ctx.beginPath();
      ctx.arc(thumb.x, thumb.y, r, 0, TAU);
      ctx.strokeStyle = current ? acc : rgba(ink, h ? 0.55 : 0.22);
      ctx.lineWidth = current ? 1.8 : 1;
      ctx.stroke();

      if (current) {
        ctx.beginPath();
        ctx.arc(thumb.x, thumb.y, r + 4, 0, TAU);
        ctx.strokeStyle = rgba(acc, 0.4);
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      if (h || (dragThumb && dragThumb.thumb === thumb && dragThumb.moved)) {
        ctx.font = `600 11px ${ff}`;
        ctx.textBaseline = 'alphabetic';
        const label = thumb.photo.title;
        let lx;
        let ly;
        if (layout.compact) {
          ctx.textAlign = 'center';
          lx = clamp(thumb.x, 60, W - 60);
          ly = thumb.y - r - 14;
        } else {
          ctx.textAlign = 'right';
          lx = thumb.x - r - 12;
          ly = thumb.y + 4;
        }
        ctx.strokeStyle = bg;
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';
        ctx.strokeText(label, lx, ly);
        ctx.fillStyle = ink;
        ctx.fillText(label, lx, ly);
      }
    }
  }

  function drawRing() {
    const nearRing = pointer.in
      && Math.abs(dist(pointer.x, pointer.y, layout.cx, layout.cy) - layout.orbitR) < 52;
    ctx.save();
    ctx.beginPath();
    ctx.arc(layout.cx, layout.cy, layout.orbitR, 0, TAU);
    ctx.setLineDash([2, 7]);
    ctx.strokeStyle = dragging || nearRing ? rgba(acc, 0.6) : rgba(sec, 0.38);
    ctx.lineWidth = dragging || nearRing ? 1.3 : 1;
    ctx.stroke();
    ctx.setLineDash([]);

    nodes.forEach((node, i) => {
      const angle = rot + (i * TAU) / nodes.length;
      const ix = layout.cx + Math.cos(angle) * (layout.orbitR - 4);
      const iy = layout.cy + Math.sin(angle) * (layout.orbitR - 4);
      const ox = layout.cx + Math.cos(angle) * (layout.orbitR + 4);
      const oy = layout.cy + Math.sin(angle) * (layout.orbitR + 4);
      ctx.beginPath();
      ctx.moveTo(ix, iy);
      ctx.lineTo(ox, oy);
      ctx.strokeStyle = rgba(acc, stateOf(node.id) ? 0.65 : 0.3);
      ctx.stroke();
    });

    if (hot >= 0) {
      const node = nodes[hot];
      const angle = Math.atan2(node.y - layout.cy, node.x - layout.cx);
      ctx.beginPath();
      ctx.moveTo(
        layout.cx + Math.cos(angle) * (layout.pr * photoK + 6),
        layout.cy + Math.sin(angle) * (layout.pr * photoK + 6)
      );
      ctx.lineTo(node.x, node.y);
      ctx.strokeStyle = rgba(acc, 0.6);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawNodes() {
    nodes.forEach((node, i) => {
      const h = i === hot;
      const onState = stateOf(node.id);
      const color = h ? on : onState ? acc : ink;

      ctx.beginPath();
      ctx.arc(node.x, node.y, node.s, 0, TAU);
      ctx.fillStyle = h ? acc : surf;
      ctx.fill();
      ctx.strokeStyle = h || onState ? acc : rgba(sec, 0.5);
      ctx.lineWidth = 1;
      ctx.stroke();
      icon(ctx, node.icon, node.x, node.y, node.s * 0.58, color);

      if (onState) {
        ctx.beginPath();
        ctx.arc(node.x + node.s * 0.64, node.y - node.s * 0.64, 2.6, 0, TAU);
        ctx.fillStyle = acc;
        ctx.fill();
      }
    });

    if (hot >= 0) {
      const node = nodes[hot];
      const angle = Math.atan2(node.y - layout.cy, node.x - layout.cx);
      const lx = clamp(node.x + Math.cos(angle) * (node.s + 26), 56, W - 56);
      const ly = clamp(node.y + Math.sin(angle) * (node.s + 20), 24, H - 32);
      ctx.font = `600 12px ${ff}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = bg;
      ctx.lineWidth = 4;
      ctx.lineJoin = 'round';
      ctx.strokeText(node.name, lx, ly);
      ctx.fillStyle = ink;
      ctx.fillText(node.name, lx, ly);
    }
  }

  function drawRipples(now) {
    for (let i = ripples.length - 1; i >= 0; i -= 1) {
      const ripple = ripples[i];
      const t = (now - ripple.t) / 680;
      if (t > 1) {
        ripples.splice(i, 1);
        continue;
      }
      const from = ripple.big ? layout.pr * 0.8 : 22;
      const to = ripple.big ? layout.pr * 1.9 : 78;
      ctx.beginPath();
      ctx.arc(ripple.x, ripple.y, from + (to - from) * (1 - Math.pow(1 - t, 3)), 0, TAU);
      ctx.strokeStyle = rgba(acc, (1 - t) * 0.65);
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  function drawStatus() {
    ctx.font = `11.5px ${ff}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(sec, 0.95);
    ctx.fillText(status, W / 2, H - 16);
  }

  function draw(now) {
    ctx.setTransform(D, 0, 0, D, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawDots();
    drawThumbs();
    drawRing();
    drawPhoto(now);
    drawNodes();
    drawRipples(now);
    drawStatus();
  }

  function point(event) {
    const rect = cv.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  cv.addEventListener('pointerdown', event => {
    const p = point(event);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.in = true;

    const hitNode = nodeAt(p.x, p.y);
    if (hitNode >= 0) {
      activate(hitNode);
      return;
    }

    const hitThumb = thumbAt(p.x, p.y);
    if (hitThumb >= 0) {
      const thumb = thumbs[hitThumb];
      dragThumb = {
        thumb,
        dx: p.x - thumb.x,
        dy: p.y - thumb.y,
        sx: p.x,
        sy: p.y,
        moved: false
      };
      setStatus('click to view · drag to rearrange');
      try {
        cv.setPointerCapture(event.pointerId);
      } catch (error) {
        void error;
      }
      return;
    }

    const d = dist(p.x, p.y, layout.cx, layout.cy);
    if (d > layout.pr * 0.9 && d < layout.orbitR + 80) {
      dragging = true;
      spin = 0;
      lastAngle = Math.atan2(p.y - layout.cy, p.x - layout.cx);
      setStatus('orbiting · release to settle');
      try {
        cv.setPointerCapture(event.pointerId);
      } catch (error) {
        void error;
      }
    }
  });

  cv.addEventListener('pointermove', event => {
    const p = point(event);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.in = true;

    if (dragThumb && !dragThumb.moved) {
      if (dist(p.x, p.y, dragThumb.sx, dragThumb.sy) > 4) {
        dragThumb.moved = true;
        setStatus('rearranging · release to settle');
      }
    }

    if (dragging) {
      const angle = Math.atan2(p.y - layout.cy, p.x - layout.cx);
      const delta = Math.atan2(Math.sin(angle - lastAngle), Math.cos(angle - lastAngle));
      rot += delta;
      spin = clamp(delta * 0.8, -0.2, 0.2);
      lastAngle = angle;
    }
  });

  function endPointer(event) {
    if (dragThumb) {
      const finished = dragThumb;
      if (finished.moved) {
        reorderThumbs();
        setStatus('contact sheet reordered');
      } else {
        selectThumb(finished.thumb);
      }
      dragThumb = null;
    }
    if (dragging) {
      dragging = false;
      setStatus(HINT, 1200);
    }
    try {
      cv.releasePointerCapture(event.pointerId);
    } catch (error) {
      void error;
    }
  }

  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('pointerleave', () => {
    pointer.in = false;
    pointer.x = -999;
    pointer.y = -999;
  });
  cv.addEventListener('contextmenu', event => event.preventDefault());

  function frame(now) {
    const step = clamp((now - lastTime) / 16.667, 0.2, 2.2);
    lastTime = now;
    update(now, step);
    draw(now);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();
  lastTime = performance.now();
  update(lastTime, 1);
  draw(lastTime);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contextual verbs</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #f3eee3;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
</style>
</head>
<body>
<canvas id="b1" role="img" aria-label="An interactive page of three sentences. Selecting a sentence reveals a list of text-only actions specific to that sentence. Hovering an action previews the rewritten sentence."></canvas>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('b1');
  const ctx = cv.getContext('2d');
  const SERIF = '"Iowan Old Style", "Charter", "Palatino Linotype", Georgia, serif';
  const SANS = '"Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
  const INK = '#26251f';
  const MUTED = '#7d776a';
  const FAINT = '#b6ae9e';
  const ACCENT = '#a8472e';
  const LINE = 'rgba(38,37,31,0.14)';
  const BG_TOP = '#f7f2e8';
  const BG_BOTTOM = '#ece4d6';
  const TITLE = 'A sentence has verbs.';
  const LEDE = 'Select a line. The actions that belong to it are written, not drawn.';
  const isCoarse = window.matchMedia('(pointer: coarse)').matches;
  const HINT_IDLE = isCoarse ? 'tap a line to see its verbs' : 'click a line to see its verbs';
  const HINT_ACTIVE = isCoarse
    ? 'tap a verb to commit · tap elsewhere to release'
    : '↑↓ preview · enter commit · esc release';

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const countWords = text => text.trim().split(/\s+/).length;

  function rgba(hex, alpha) {
    const clean = hex.replace('#', '');
    const n = parseInt(clean, 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }

  function wrapText(text, maxWidth, font) {
    ctx.font = font;
    const words = text.trim().split(/\s+/);
    const lines = [];
    let current = '';
    for (const word of words) {
      const candidate = current ? `${current} ${word}` : word;
      if (ctx.measureText(candidate).width > maxWidth && current) {
        lines.push({ text: current, width: ctx.measureText(current).width });
        current = word;
      } else {
        current = candidate;
      }
    }
    if (current) lines.push({ text: current, width: ctx.measureText(current).width });
    return lines;
  }

  const FRAGMENTS = [
    {
      kind: 'claim',
      text: 'A good interface disappears, leaving only the work.',
      original: 'A good interface disappears, leaving only the work.',
      actions: [
        {
          label: 'Soften the claim',
          text: 'A good interface can nearly disappear, leaving the work in view.'
        },
        {
          label: 'Ground it in an example',
          text: 'The best interface is the one you stop noticing by the second day.'
        },
        {
          label: 'Name the cost',
          text: 'A good interface disappears, but someone has to build that quiet.'
        },
        {
          label: 'Turn it into a question',
          text: 'What would disappear if the interface worked?'
        }
      ]
    },
    {
      kind: 'moment',
      text: 'Review the prototype on Thursday at 10:00.',
      original: 'Review the prototype on Thursday at 10:00.',
      actions: [
        {
          label: 'Move it to Tuesday',
          text: 'Review the prototype on Tuesday at 10:00.'
        },
        {
          label: 'Make it thirty minutes',
          text: 'Review the prototype on Thursday at 10:00 for thirty minutes.'
        },
        {
          label: 'Move it online',
          text: 'Review the prototype on a video call, Thursday at 10:00.'
        },
        {
          label: 'Add a decision',
          text: 'Review the prototype on Thursday at 10:00 and decide whether to build it.'
        }
      ]
    },
    {
      kind: 'question',
      text: 'What would make this feel less like a document?',
      original: 'What would make this feel less like a document?',
      actions: [
        {
          label: 'Answer it plainly',
          text: 'It feels like a document because it is waiting for you to ask.'
        },
        {
          label: 'Turn it into a task',
          text: 'Spend a day using the prototype without any visible controls.'
        },
        {
          label: 'Find the prior art',
          text: 'Read about calm technology before designing another toolbar.'
        },
        {
          label: 'Ask someone else',
          text: 'Ask three daily users what they think the interface is for.'
        }
      ]
    }
  ];

  FRAGMENTS.forEach(fragment => {
    fragment.x = 0;
    fragment.labelY = 0;
    fragment.textY = 0;
    fragment.lineH = 0;
    fragment.bodySize = 0;
    fragment.width = 0;
    fragment.lines = [];
    fragment.revised = false;
    fragment.previewing = false;
    fragment.words = countWords(fragment.text);
  });

  let W = 0;
  let H = 0;
  let D = 1;
  let layout = null;
  let actionLayout = null;
  let actionRects = [];
  let active = 0;
  let hoverFragment = -1;
  let hoverAction = -1;
  let keyboardAction = -1;
  let selectedAt = performance.now() - 1000;
  let flashUntil = 0;
  let status = '';
  let statusUntil = 0;
  let pointer = { x: -999, y: -999, in: false };

  function setStatus(text, duration = 2300) {
    status = text;
    statusUntil = performance.now() + duration;
  }

  function actionsFor(fragment) {
    if (fragment.text !== fragment.original) {
      return [
        ...fragment.actions,
        {
          label: 'Restore the original line',
          text: fragment.original,
          restore: true
        }
      ];
    }
    return fragment.actions;
  }

  function effectiveAction() {
    if (keyboardAction >= 0) return keyboardAction;
    return hoverAction;
  }

  function currentList() {
    if (active < 0) return [];
    return actionsFor(FRAGMENTS[active]);
  }

  function layoutScene() {
    const compact = W < 880;
    let contentW;
    let actionW;
    let gap;
    let startX;

    if (compact) {
      startX = clamp(W * 0.065, 20, 34);
      contentW = W - startX * 2;
      actionW = contentW;
      gap = 0;
    } else {
      contentW = Math.min(620, W * 0.44);
      gap = clamp(W * 0.055, 50, 92);
      actionW = Math.min(300, W * 0.24);
      const total = contentW + gap + actionW;
      startX = Math.max(64, (W - total) / 2);
    }

    const titleSize = compact ? clamp(W * 0.082, 30, 38) : clamp(W * 0.035, 40, 54);
    const bodySize = compact
      ? (H < 760 ? clamp(W * 0.048, 18, 20) : clamp(W * 0.052, 19, 24))
      : clamp(Math.min(W * 0.022, H * 0.036), 22, 30);
    const metaY = compact ? (H < 760 ? 24 : 30) : 40;
    const titleTop = metaY + titleSize + (compact ? 18 : 32);
    const titleFont = `400 ${titleSize}px ${SERIF}`;
    const titleLines = wrapText(TITLE, contentW, titleFont);
    const titleLineH = titleSize * 1.08;
    const titleBottom = titleTop + (titleLines.length - 1) * titleLineH;
    const ledeFont = `400 ${compact ? 12 : 13.5}px ${SANS}`;
    const ledeTop = titleBottom + (compact ? 18 : 26);
    const ledeLines = wrapText(LEDE, contentW, ledeFont);
    const ledeLineH = compact ? 18 : 20;
    const ledeBottom = ledeTop + (ledeLines.length - 1) * ledeLineH;
    const startY = ledeBottom + (compact ? (H < 760 ? 24 : 36) : 56);
    const typeGap = compact ? (H < 760 ? 19 : 21) : 27;
    const lineH = Math.round(bodySize * 1.34);
    const slotGap = compact ? (H < 760 ? 16 : 24) : clamp(H * 0.036, 24, 38);

    let y = startY;
    FRAGMENTS.forEach(fragment => {
      fragment.x = startX;
      fragment.labelY = y;
      fragment.textY = y + typeGap;
      fragment.lineH = lineH;
      fragment.bodySize = bodySize;
      fragment.width = contentW;
      y += typeGap + lineH * 3 + slotGap;
    });

    layout = {
      compact,
      startX,
      contentW,
      gap,
      actionX: startX + contentW + gap,
      actionW,
      titleSize,
      titleFont,
      titleTop,
      titleLineH,
      titleLines,
      ledeFont,
      ledeTop,
      ledeLineH,
      ledeLines,
      metaY,
      bodySize,
      lineH,
      typeGap,
      startY,
      fragmentsEnd: y
    };
  }

  function computeActionLayout() {
    if (active < 0) return null;
    const fragment = FRAGMENTS[active];
    const list = actionsFor(fragment);
    const rowH = layout.compact ? 31 : 34;
    const headerH = layout.compact ? 34 : 38;
    const totalH = headerH + rowH * list.length;
    const x = layout.compact ? layout.startX : layout.actionX;
    const width = layout.compact ? layout.contentW : layout.actionW;
    let top;
    if (layout.compact) {
      top = H - totalH - 54;
    } else {
      top = clamp(fragment.textY - 6, 140, Math.max(140, H - totalH - 68));
    }
    const rows = list.map((action, i) => ({
      x,
      y: top + headerH + i * rowH,
      w: width,
      h: rowH,
      action,
      index: i
    }));
    return {
      x,
      width,
      top,
      headerH,
      rowH,
      totalH,
      list,
      rows,
      kind: fragment.kind,
      words: countWords(fragment.text)
    };
  }

  function updateLines() {
    const previewIndex = effectiveAction();
    FRAGMENTS.forEach((fragment, index) => {
      const list = actionsFor(fragment);
      const candidate = index === active && previewIndex >= 0 ? list[previewIndex] : null;
      const preview = candidate && candidate.text !== fragment.text ? candidate : null;
      const text = preview ? preview.text : fragment.text;
      const font = `400 ${fragment.bodySize}px ${SERIF}`;
      fragment.lines = wrapText(text, fragment.width, font);
      fragment.previewing = Boolean(preview);
      fragment.revised = fragment.text !== fragment.original;
      fragment.words = countWords(fragment.text);
    });
  }

  function fragmentAt(px, py) {
    for (let i = 0; i < FRAGMENTS.length; i += 1) {
      const fragment = FRAGMENTS[i];
      for (let line = 0; line < fragment.lines.length; line += 1) {
        const top = fragment.textY + line * fragment.lineH;
        const width = fragment.lines[line].width;
        if (
          px >= fragment.x - 7 &&
          px <= fragment.x + width + 9 &&
          py >= top - 2 &&
          py <= top + fragment.lineH + 2
        ) {
          return i;
        }
      }
    }
    return -1;
  }

  function selectFragment(index) {
    if (index < 0 || index >= FRAGMENTS.length) return;
    if (index !== active) {
      active = index;
      selectedAt = performance.now();
      flashUntil = 0;
      keyboardAction = -1;
      hoverAction = -1;
      status = '';
      statusUntil = 0;
    }
  }

  function clearSelection() {
    active = -1;
    hoverAction = -1;
    keyboardAction = -1;
    hoverFragment = -1;
    status = '';
    statusUntil = 0;
  }

  function commitAction(index) {
    if (active < 0) return;
    const fragment = FRAGMENTS[active];
    const list = actionsFor(fragment);
    const action = list[index];
    if (!action) return;
    fragment.text = action.restore ? fragment.original : action.text;
    hoverAction = -1;
    keyboardAction = -1;
    selectedAt = performance.now();
    flashUntil = performance.now() + 460;
    setStatus(action.restore ? 'original line restored' : 'line rewritten · undo in the margin');
  }

  function update(now) {
    actionLayout = computeActionLayout();
    actionRects = actionLayout ? actionLayout.rows : [];

    let pointerAction = -1;
    if (pointer.in) {
      for (let i = 0; i < actionRects.length; i += 1) {
        const row = actionRects[i];
        if (
          pointer.x >= row.x - 4 &&
          pointer.x <= row.x + row.w + 4 &&
          pointer.y >= row.y - 3 &&
          pointer.y <= row.y + row.h + 3
        ) {
          pointerAction = i;
          break;
        }
      }
    }

    if (pointerAction >= 0) {
      hoverAction = pointerAction;
      hoverFragment = -1;
    } else if (pointer.in) {
      if (hoverAction !== -1) hoverAction = -1;
      hoverFragment = fragmentAt(pointer.x, pointer.y);
    } else {
      hoverAction = -1;
      hoverFragment = -1;
    }

    if (active < 0) {
      hoverAction = -1;
      keyboardAction = -1;
      hoverFragment = -1;
    }

    updateLines();

    if (statusUntil && now > statusUntil) {
      status = '';
      statusUntil = 0;
    }

    cv.style.cursor = (hoverAction >= 0 || hoverFragment >= 0) ? 'pointer' : 'default';
  }

  function frame(now) {
    update(now);
    draw(now);
    requestAnimationFrame(frame);
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, BG_TOP);
    sky.addColorStop(1, BG_BOTTOM);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(W * 0.82, H * 0.08, 0, W * 0.82, H * 0.08, Math.max(W, H) * 0.7);
    glow.addColorStop(0, rgba(ACCENT, 0.055));
    glow.addColorStop(0.6, rgba(ACCENT, 0.012));
    glow.addColorStop(1, rgba(ACCENT, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    if (!layout.compact) {
      ctx.beginPath();
      ctx.moveTo(layout.startX - 32, layout.metaY - 4);
      ctx.lineTo(layout.startX - 32, H - 64);
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawHeader() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = `500 9px ${MONO}`;
    ctx.fillStyle = MUTED;
    ctx.fillText('INTERFACE STUDY / 02', layout.startX, layout.metaY);

    ctx.font = layout.titleFont;
    ctx.fillStyle = INK;
    layout.titleLines.forEach((line, i) => {
      ctx.fillText(line.text, layout.startX, layout.titleTop + i * layout.titleLineH);
    });

    ctx.font = layout.ledeFont;
    ctx.fillStyle = MUTED;
    layout.ledeLines.forEach((line, i) => {
      ctx.fillText(line.text, layout.startX, layout.ledeTop + i * layout.ledeLineH);
    });
  }

  function drawFragments(now) {
    FRAGMENTS.forEach((fragment, index) => {
      const selected = index === active;
      const hovered = index === hoverFragment;
      const number = String(index + 1).padStart(2, '0');
      let state = `${fragment.words} WORDS`;
      if (fragment.previewing) state = 'PREVIEW';
      else if (fragment.revised) state = `${fragment.words} WORDS · REVISED`;
      const label = `${number} / ${fragment.kind.toUpperCase()} / ${state}`;

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = `500 9px ${MONO}`;
      ctx.fillStyle = selected ? ACCENT : hovered ? INK : MUTED;
      ctx.fillText(label, fragment.x, fragment.labelY);

      let wash = 0;
      let washColor = ACCENT;
      if (selected) wash = 0.072;
      else if (hovered) {
        wash = 0.035;
        washColor = INK;
      }
      if (selected && now < flashUntil) wash = 0.13;

      if (wash > 0) {
        ctx.fillStyle = rgba(washColor, wash);
        fragment.lines.forEach((line, lineIndex) => {
          const top = fragment.textY + lineIndex * fragment.lineH;
          ctx.fillRect(fragment.x - 7, top + 3, line.width + 14, fragment.lineH - 6);
        });
      }

      if (selected) {
        ctx.fillStyle = rgba(ACCENT, 0.72);
        ctx.fillRect(
          fragment.x - 16,
          fragment.textY + 4,
          2,
          Math.max(20, fragment.lines.length * fragment.lineH - 8)
        );
      }

      ctx.font = `400 ${fragment.bodySize}px ${SERIF}`;
      ctx.fillStyle = fragment.previewing ? ACCENT : INK;
      fragment.lines.forEach((line, lineIndex) => {
        const top = fragment.textY + lineIndex * fragment.lineH;
        const middle = top + fragment.lineH / 2;
        ctx.fillText(line.text, fragment.x, middle);
        if (fragment.previewing) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(fragment.x, middle + fragment.lineH * 0.28);
          ctx.lineTo(fragment.x + line.width, middle + fragment.lineH * 0.28);
          ctx.setLineDash([1, 4]);
          ctx.strokeStyle = rgba(ACCENT, 0.52);
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }
      });
    });
  }

  function drawActions(now) {
    if (!actionLayout) return;
    const { x, top, width, headerH, list } = actionLayout;

    if (layout.compact && top - 18 < layout.fragmentsEnd) {
      ctx.fillStyle = BG_BOTTOM;
      ctx.fillRect(0, top - 18, W, H - top + 18);
    }

    if (!layout.compact) {
      ctx.beginPath();
      ctx.moveTo(x - 18, top - 4);
      ctx.lineTo(x - 18, top + actionLayout.totalH);
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const headerAlpha = easeOutCubic(clamp((now - selectedAt) / 220, 0, 1));
    ctx.save();
    ctx.globalAlpha = headerAlpha;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = `500 9px ${MONO}`;
    ctx.fillStyle = MUTED;
    const contextLabel = `${actionLayout.kind.toUpperCase()} · ${actionLayout.words} WORDS · ${list.length} VERBS`;
    ctx.fillText(contextLabel, x, top + 10);

    ctx.beginPath();
    ctx.moveTo(x, top + headerH - 11);
    ctx.lineTo(x + width, top + headerH - 11);
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    const current = effectiveAction();
    const fontSize = layout.compact ? 14.5 : 15.5;

    actionLayout.rows.forEach((row, index) => {
      const action = row.action;
      const alpha = easeOutCubic(clamp((now - selectedAt - index * 45) / 300, 0, 1));
      if (alpha <= 0.001) return;
      const hovered = current === index;
      const shift = (1 - alpha) * 8 + (hovered ? 6 : 0);
      const rowX = row.x + shift;
      const middle = row.y + row.h / 2 + 1;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = `500 8px ${MONO}`;
      ctx.fillStyle = hovered ? ACCENT : FAINT;
      ctx.fillText(String(index + 1).padStart(2, '0'), rowX, middle);

      ctx.font = `${action.restore ? 'italic ' : ''}${hovered ? '600' : '400'} ${fontSize}px ${SANS}`;
      ctx.fillStyle = hovered ? ACCENT : INK;
      ctx.fillText(action.label, rowX + 27, middle);

      if (hovered) {
        const labelWidth = ctx.measureText(action.label).width;
        ctx.beginPath();
        ctx.moveTo(rowX + 27, middle + 9);
        ctx.lineTo(rowX + 27 + labelWidth, middle + 9);
        ctx.strokeStyle = rgba(ACCENT, 0.5);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();
    });
  }

  function drawFooter(now) {
    const fadingStatus = now < statusUntil;
    const text = fadingStatus ? status : active >= 0 ? HINT_ACTIVE : HINT_IDLE;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = `500 ${layout.compact ? 8.5 : 9}px ${MONO}`;
    ctx.fillStyle = fadingStatus ? ACCENT : MUTED;
    ctx.fillText(text, W / 2, H - 22);
  }

  function draw(now) {
    ctx.setTransform(D, 0, 0, D, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawHeader();
    drawFragments(now);
    drawActions(now);
    drawFooter(now);
  }

  function point(event) {
    const rect = cv.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  function actionAt(px, py) {
    for (let i = 0; i < actionRects.length; i += 1) {
      const row = actionRects[i];
      if (
        px >= row.x - 4 &&
        px <= row.x + row.w + 4 &&
        py >= row.y - 3 &&
        py <= row.y + row.h + 3
      ) {
        return i;
      }
    }
    return -1;
  }

  cv.addEventListener('pointermove', event => {
    const p = point(event);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.in = true;
    keyboardAction = -1;
  });

  cv.addEventListener('pointerdown', event => {
    event.preventDefault();
    const p = point(event);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.in = true;
    keyboardAction = -1;

    const actionIndex = actionAt(p.x, p.y);
    if (actionIndex >= 0) {
      commitAction(actionIndex);
      return;
    }

    const fragmentIndex = fragmentAt(p.x, p.y);
    if (fragmentIndex >= 0) {
      selectFragment(fragmentIndex);
    } else {
      clearSelection();
    }
  });

  cv.addEventListener('pointerleave', () => {
    pointer.in = false;
    pointer.x = -999;
    pointer.y = -999;
    hoverAction = -1;
    hoverFragment = -1;
  });

  cv.addEventListener('contextmenu', event => event.preventDefault());

  window.addEventListener('keydown', event => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;

    if (event.key === 'Escape') {
      if (active >= 0) {
        clearSelection();
        setStatus('selection released', 1300);
      }
      return;
    }

    if (active < 0) return;
    const list = currentList();

    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      const direction = event.key === 'ArrowDown' ? 1 : -1;
      const current = keyboardAction >= 0 ? keyboardAction : hoverAction;
      keyboardAction = current < 0
        ? (direction > 0 ? 0 : list.length - 1)
        : (current + direction + list.length) % list.length;
      hoverAction = -1;
    }

    if (event.key === 'Enter') {
      event.preventDefault();
      const index = keyboardAction >= 0 ? keyboardAction : hoverAction >= 0 ? hoverAction : 0;
      commitAction(index);
    }
  });

  function resize() {
    D = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width = Math.round(W * D);
    cv.height = Math.round(H * D);
    layoutScene();
    computeActionLayout();
    updateLines();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  resize();
  const start = performance.now();
  update(start);
  draw(start);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

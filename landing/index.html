<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quint – Software that grows for you</title>
    <meta
      name="description"
      content="Chat was only the beginning. With Quint, your AI agents build the interface themselves, so your software grows for you."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://quint.run/" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Open Graph / Twitter (replace og-image.png with a 1200x630 image) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quint" />
    <meta property="og:title" content="Quint – Software that grows for you" />
    <meta
      property="og:description"
      content="Chat was only the beginning. Your agents build the interface themselves."
    />
    <meta property="og:url" content="https://quint.run/" />
    <meta property="og:image" content="https://quint.run/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quint – software that grows for you" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quint – Software that grows for you" />
    <meta
      name="twitter:description"
      content="Chat was only the beginning. Your agents build the interface themselves."
    />
    <meta name="twitter:image" content="https://quint.run/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Quint",
        "url": "https://quint.run/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "Software that grows for you: your agents build the interface themselves."
      }
    </script>

    <!-- Fonts: only the weights in use, swap, non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400&family=Space+Mono:wght@400&display=swap"
      onload="this.rel = 'stylesheet'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Jost:wght@400&family=Space+Mono:wght@400&display=swap"
    /></noscript>

    <!-- Hero images -->
    <link rel="preload" as="image" href="robot-hand.webp" crossorigin />
    <link rel="preload" as="image" href="human-hand.webp" crossorigin />

    <style>
      *,
      ::before,
      ::after {
        box-sizing: border-box;
      }
      :root {
        --cream: 254 250 235;
        --gold: #ffc24a;
        --pad: 0.75rem;
      }
      html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #fcf8eb;
        color: #fff;
        font-family: Jost, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1,
      p {
        margin: 0;
      }
      svg,
      canvas {
        display: block;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .ts {
        text-shadow:
          0 1px 2px #000,
          0 0 16px #000;
      }

      .frame {
        padding: var(--pad);
      }
      main {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: calc(100svh - 2 * var(--pad));
        overflow: hidden;
        border-radius: 1rem;
        background: #000;
      }

      .nav {
        position: relative;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.5rem 1.25rem 0;
      }
      .logo {
        height: 1.25rem;
        width: auto;
      }

      .hero {
        position: relative;
        z-index: 30;
        padding: 0 1.25rem;
      }
      .hero-text {
        position: relative;
        z-index: 30;
        width: 100%;
        max-width: 56rem;
        margin: clamp(4rem, 12vh, 7rem) auto 0;
        text-align: center;
      }
      h1 {
        font-size: clamp(2.25rem, 5.5vw, 3.5rem);
        font-weight: 400;
        line-height: 1.08;
        text-wrap: balance;
        color: transparent;
        background: linear-gradient(to bottom, #fefaeb, #ffc24a, #f00207);
        -webkit-background-clip: text;
        background-clip: text;
      }
      .sm-br {
        display: none;
      }
      .sub {
        max-width: 36rem;
        margin: 1.5rem auto 0;
        font:
          clamp(0.875rem, 1.1vw, 1rem)/1.5rem 'Space Mono',
          monospace;
        color: rgb(255 255 255/0.8);
      }

      .stage {
        position: relative;
        width: 100%;
        margin: 2.5rem auto 0;
      }
      .hand {
        position: absolute;
        z-index: 20;
        aspect-ratio: 4/3;
        pointer-events: none;
      }
      #robotHand {
        left: -14%;
        top: 10%;
        width: 60%;
        max-width: 700px;
        transform: translateY(-35%);
      }
      #humanHand {
        right: -14%;
        top: 80%;
        width: 58%;
        max-width: 720px;
        transform: translateY(-25%);
      }

      .options {
        position: relative;
        display: grid;
        gap: 2rem;
        max-width: 28rem;
        margin: 0 auto;
        text-align: left;
      }
      .card {
        display: flex;
        flex-direction: column;
        padding: 1rem;
        border: 1px solid rgb(var(--cream) / 0.15);
        border-radius: 0.75rem;
        background: rgb(0 0 0/0.3);
      }
      .card-head {
        position: relative;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: rgb(var(--cream) / 0.55);
      }
      .dot {
        width: 0.375rem;
        height: 0.375rem;
        border-radius: 50%;
      }
      .copy {
        flex-shrink: 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: rgb(var(--cream) / 0.5);
        transition: color 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .copy:hover,
      .card:hover .copy {
        color: var(--gold);
      }
      .body {
        position: relative;
        z-index: 30;
        margin-top: 1rem;
        font-size: 0.875rem;
        line-height: 1.5rem;
        color: rgb(var(--cream) / 0.9);
      }
      .body a {
        color: rgb(var(--cream));
        white-space: nowrap;
      }
      .body a:hover {
        text-decoration: underline;
      }
      .body span {
        display: block;
      }
      .body .dim {
        color: rgb(var(--cream) / 0.4);
      }
      .body .cmd {
        color: rgb(var(--cream));
      }
      .body .pre {
        margin-right: 0.5rem;
        color: rgb(var(--cream) / 0.35);
      }

      @media (min-width: 640px) {
        :root {
          --pad: 1rem;
        }
        main {
          border-radius: 1.5rem;
        }
        .nav {
          padding: 1.75rem 2rem 0;
        }
        .logo {
          height: 1.5rem;
        }
        .hero {
          padding: 0 1.5rem;
        }
        .sm-br {
          display: block;
        }
        .stage {
          margin-top: 4rem;
        }
        #robotHand {
          left: -6%;
          width: 46%;
        }
        #humanHand {
          right: -6%;
          width: 44%;
        }
      }
      @media (min-width: 768px) {
        :root {
          --pad: 1.5rem;
        }
        .nav {
          padding-left: 2.5rem;
          padding-right: 2.5rem;
        }
      }
      @media (min-width: 1024px) {
        .stage {
          margin-top: 6rem;
        }
        #robotHand {
          left: -4%;
          width: 42%;
        }
        #humanHand {
          right: -4%;
          width: 40%;
        }
      }
      @media (min-width: 1536px) {
        .stage {
          margin-top: 7rem;
        }
      }
    </style>
  </head>

  <body>

        <section class="hero">
          <div class="hero-text">
            <h1>
              Software was built for everyone.<br class="sm-br" />
              This one grows for you.
            </h1>
            <p class="sub ts">
              chat was only the beginning - now your agents<br class="sm-br" />
              build the interface themselves
            </p>
          </div>

          <div class="stage">
            <canvas id="robotHand" class="hand" aria-hidden="true"></canvas>
            <canvas id="humanHand" class="hand" aria-hidden="true"></canvas>

            <div class="options">
              <div class="card">
                <div class="card-head ts">
                  <div class="tag">
                    <span class="dot" style="background: #5b8cff"></span>For AI agents
                  </div>
                  <button
                    type="button"
                    class="copy"
                    aria-label="Copy AI agent prompt"
                    data-copy="Set up my QUINT workspace for this. Follow the steps at https://quint.run."
                  >
                    <span data-copy-label>Copy</span>
                  </button>
                </div>
                <p class="body ts">
                  Set up my QUINT workspace for this. Follow the steps at
                  <a href="https://quint.run" target="_blank" rel="noopener">https://quint.run</a>.
                </p>
              </div>

              <div class="card">
                <div class="card-head ts">
                  <div class="tag">
                    <span class="dot" style="background: #ffab04"></span>For humans
                  </div>
                  <button
                    type="button"
                    class="copy"
                    aria-label="Copy install command"
                    data-copy="bunx quint init --web"
                  >
                    <span data-copy-label>Copy</span>
                  </button>
                </div>
                <div class="body ts">
                  <span class="dim"># inside your project folder</span>
                  <span class="cmd"><span class="pre">$</span>bunx quint init --web</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      function dotify(
        canvas,
        {
          src,
          gap = 4,
          maxR = 5,
          threshold = 35,
          retro = false,
          mono = false,
          radius = 90,
          assemble = true
        }
      ) {
        const ctx = canvas.getContext('2d')
        const img = new Image()
        img.crossOrigin = 'anonymous'
        img.src = src

        let dots = [],
          firstBuild = true,
          running = false,
          visible = true
        const mouse = { x: -9999, y: -9999 }

        const RETRO_STOPS = [
          [0.0, [52, 34, 28]], // espresso brown
          [0.35, [150, 70, 40]], // burnt orange
          [0.65, [208, 150, 58]], // mustard
          [1.0, [238, 220, 182]] // cream
        ]

        function retroColor(r, g, b, lum, keep = 0.25) {
          const t = Math.min(1, lum / 255)
          let a = RETRO_STOPS[0],
            z = RETRO_STOPS[RETRO_STOPS.length - 1]
          for (let i = 0; i < RETRO_STOPS.length - 1; i++) {
            if (t >= RETRO_STOPS[i][0] && t <= RETRO_STOPS[i + 1][0]) {
              a = RETRO_STOPS[i]
              z = RETRO_STOPS[i + 1]
              break
            }
          }
          const k = (t - a[0]) / (z[0] - a[0] || 1)
          const mapped = a[1].map((v, j) => v + (z[1][j] - v) * k)
          const orig = [r, g, b].map(v => lum + (v - lum) * 0.5)
          return `rgb(${mapped.map((v, j) => (v * (1 - keep) + orig[j] * keep) | 0).join(',')})`
        }

        function build() {
          const dpr = window.devicePixelRatio || 1
          const w = canvas.clientWidth,
            h = canvas.clientHeight
          canvas.width = w * dpr
          canvas.height = h * dpr
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0)

          const off = document.createElement('canvas')
          off.width = w
          off.height = h
          const octx = off.getContext('2d', { willReadFrequently: true })
          const s = Math.min(w / img.width, h / img.height)
          const dw = img.width * s,
            dh = img.height * s
          octx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh)
          const data = octx.getImageData(0, 0, w, h).data

          const scale = Math.min(1, Math.max(0.6, w / 700))
          const cell = gap * scale
          const dotMax = maxR * scale

          dots = []
          for (let y = cell / 2; y < h; y += cell) {
            for (let x = cell / 2; x < w; x += cell) {
              const i = ((y | 0) * w + (x | 0)) * 4
              const r = data[i],
                g = data[i + 1],
                b = data[i + 2],
                a = data[i + 3]
              const lum = (0.299 * r + 0.587 * g + 0.114 * b) * (a / 255)
              if (lum < threshold) continue
              dots.push({
                hx: x,
                hy: y,
                x: assemble && firstBuild ? x + (Math.random() - 0.5) * 600 : x,
                y: assemble && firstBuild ? y + (Math.random() - 0.5) * 600 : y,
                vx: 0,
                vy: 0,
                r: dotMax * Math.pow(lum / 255, 0.8),
                c: retro
                  ? retroColor(r, g, b, lum)
                  : mono
                    ? `rgb(${lum | 0},${lum | 0},${lum | 0})`
                    : `rgb(${r},${g},${b})`
              })
            }
          }
          firstBuild = false
        }

        // The loop only runs while something is moving, and only while the canvas is on screen.
        function wake() {
          if (running || !visible || !dots.length) return
          running = true
          requestAnimationFrame(frame)
        }

        function frame() {
          if (!visible) {
            running = false
            return
          }
          ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight)
          let moving = false
          for (const d of dots) {
            const dx = d.x - mouse.x,
              dy = d.y - mouse.y
            const dist = Math.hypot(dx, dy)
            if (dist < radius && dist > 0) {
              const f = (1 - dist / radius) * 6
              d.vx += (dx / dist) * f
              d.vy += (dy / dist) * f
            }
            d.vx += (d.hx - d.x) * 0.06
            d.vy += (d.hy - d.y) * 0.06
            d.vx *= 0.82
            d.vy *= 0.82
            d.x += d.vx
            d.y += d.vy

            if (
              !moving &&
              (Math.abs(d.vx) > 0.01 ||
                Math.abs(d.vy) > 0.01 ||
                Math.abs(d.hx - d.x) > 0.05 ||
                Math.abs(d.hy - d.y) > 0.05)
            )
              moving = true

            ctx.fillStyle = d.c
            ctx.beginPath()
            ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2)
            ctx.fill()
          }
          if (moving) requestAnimationFrame(frame)
          else running = false
        }

        window.addEventListener(
          'pointermove',
          e => {
            if (e.pointerType === 'touch') return
            const b = canvas.getBoundingClientRect()
            mouse.x = e.clientX - b.left
            mouse.y = e.clientY - b.top
            if (
              mouse.x > -radius &&
              mouse.x < b.width + radius &&
              mouse.y > -radius &&
              mouse.y < b.height + radius
            )
              wake()
          },
          { passive: true }
        )
        document.documentElement.addEventListener('pointerleave', () => {
          mouse.x = -9999
          mouse.y = -9999
          wake()
        })

        new IntersectionObserver(
          ([e]) => {
            visible = e.isIntersecting
            if (visible) wake()
          },
          { rootMargin: '100px' }
        ).observe(canvas)

        img.onload = () => {
          build()
          wake()
        }
        let resizeTimer
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer)
          resizeTimer = setTimeout(() => {
            if (img.complete) {
              build()
              wake()
            }
          }, 150)
        })
      }

      dotify(document.getElementById('robotHand'), { src: 'robot-hand.webp', mono: true })
      dotify(document.getElementById('humanHand'), { src: 'human-hand.webp', retro: true })

      document.querySelectorAll('[data-copy]').forEach(button => {
        button.addEventListener('click', async () => {
          const text = button.dataset.copy
          try {
            await navigator.clipboard.writeText(text)
          } catch {
            const field = document.createElement('textarea')
            field.value = text
            field.setAttribute('readonly', '')
            field.style.cssText = 'position:fixed;opacity:0'
            document.body.appendChild(field)
            field.select()
            document.execCommand('copy')
            field.remove()
          }
          const label = button.querySelector('[data-copy-label]') || button
          const original = label.textContent
          label.textContent = 'Copied'
          button.style.color = '#FFC24A'
          setTimeout(() => {
            label.textContent = original
            button.style.color = ''
          }, 1400)
        })
      })
    </script>
